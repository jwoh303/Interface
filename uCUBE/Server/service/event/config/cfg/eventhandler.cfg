## 10,11,12 는 Adapter handler의해 아답터들이 실행할때,  
## Liver Checker로 설정되면, 상태 정보를 전달하기위한 쿼리들이다.

#10. TB_S60_SERV010 에 Liver Checker 값이 있는 아답터들을 확인하는 쿼리 
CHECK_SERV_INFO = SELECT COUNT(1) FROM TB_S60_SERV010 \
			           WHERE APPLICATION_SHORT_NAME = ?  AND SERVICE_INST_ID = ?
				  

#11. TB_S60_SERV010 에 Liver Checker 값이 없으면 아답터 정보 입력 
INSERT_SERV_INFO = INSERT INTO TB_S60_SERV010 (                                   \
                   APPLICATION_SHORT_NAME, SERVICE_INST_ID,  SERVICE_GUID,        \
				   EAI_SERVICE_SEQ_NO, CREATION_TIMESTAMP )                       \
				   VALUES (  ?,?,?,?,to_timestamp(?,'yyyy/mm/dd hh24:mi:ss:ff'))
				   


# 12. TB_S60_SERV010 에 Liver Checker값이 있으며 아답터 정보 업데이트 
UPDATE_SERV_INFO = UPDATE TB_S60_SERV010 SET SERVICE_GUID = ? ,EAI_SERVICE_SEQ_NO = ? ,  \
				   LAST_UPDATE_TIMESTAMP = to_timestamp(?,'yyyy/mm/dd hh24:mi:ss:ff')    \
			       WHERE    APPLICATION_SHORT_NAME = ? AND SERVICE_INST_ID = ?                    
   
				   
# 13. TB_S60_STAT020에 Adpater Link 의 Status 정보 체킹 쿼리 
CHECK_SERV_STATUS_INFO = SELECT IP_NUMBERS, BL_STATUS, DATA_ACCRUAL_TIME,                         \
						 LAST_UPDATE_TIMESTAMP, CREATION_TIMESTAMP FROM TB_S60_STAT020            \
			             WHERE  EAI_SYSTEM_ID = ? AND SERVICE_NAME = ? AND SERVICE_LINK_NAME = ? 

# 14. TB_S60_STAT020 테이블에 동일  시스템의 아답터의 서비스가 있을경우 업데이트 쿼리 
UPDATE_SERV_STATUS_INFO = UPDATE TB_S60_STAT020                                               \
                          SET LAST_UPDATE_TIMESTAMP = SYSDATE                    ,            \
						      BL_STATUS             = ?                          ,            \
							  IP_NUMBERS            = ?                          ,            \
							  DESCRIPTION           = substrb(?,1,255)                       \
			              WHERE EAI_SYSTEM_ID = ? AND SERVICE_NAME = ? AND SERVICE_LINK_NAME = ?


# 15. TB_S60_STAT020 테이블에 동일  시스템의 아답터의 서비스가 없을경우 입력 쿼리 
INSERT_SERV_STATUS_INFO = INSERT INTO TB_S60_STAT020                           \
                          (     STATUS_SEQ_ID        ,                         \
								EAI_SYSTEM_ID        ,                         \
								SERVICE_NAME         ,                         \
								SERVICE_LINK_NAME    ,                         \
								BL_STATUS            ,                         \
								CREATION_TIMESTAMP   ,                         \
								LAST_UPDATE_TIMESTAMP,                         \
								IP_NUMBERS           ,                         \
								DESCRIPTION          ,                         \
								DATA_ACCRUAL_TIME                              \
						  )                                                    \
			             VALUES                                                \
						 (      SQ_S60STAT020_01.NEXTVAL  ,                    \
						        ?,?,?,?,SYSDATE,SYSDATE,? ,                    \
								substrb(?,1,255)          ,                    \
								to_timestamp(SYSDATE, 'yyyy/mm/dd hh24:mi:ss:ff')    \
					      )
						  
# 16. TB_S60_STAT020을 주기적으로 체크해서 최근 시간과 현재 시간과의 차이(100000ms)가 나면
# 해당 아답터가 down 된것으로 간주하고. SMS message를 전송하기위한 목적의 쿼리이다. 
SELECT_SERV_STATUS_INFO = SELECT EAI_SYSTEM_ID, SERVICE_NAME, SERVICE_LINK_NAME,       \
                          TO_CHAR(LAST_UPDATE_TIMESTAMP, 'yyyy/mm/dd hh24:mi:ss:ff')   \
						  FROM TB_S60_STAT020 WHERE LAST_UPDATE_TIMESTAMP IS NOT NULL


						  
#17. Adapter Error 를 TB_S60_UERR010 check
CHECK_SERV_ERROR_INFO = SELECT COUNT(1) FROM TB_S60_UERR010                                      \
                        WHERE LOCAL_QUEUE_NAME = UPPER(?) AND TRANSACTION_CODE = substrb(?,1,8)  \
						AND EAI_SEND_TIMESTAMP = TO_TIMESTAMP(?,'yyyy/mm/dd hh24:mi:ss:ff')

# 18. Adapter Error 를 TB_S60_UERR010 table 에 데이터 insert
INSERT_SERV_ERROR_INFO = INSERT INTO TB_S60_UERR010                                 \
                        (             LOCAL_QUEUE_NAME                           ,  \
						              TRANSACTION_CODE                           ,  \
						        	  EAI_SEND_TIMESTAMP                         ,  \
									  EAI_RECEIVE_TIMESTAMP                      ,  \
									  EAI_SYSTEM_ID                              ,  \
									  EAI_INTERFACE_ID                           ,  \
									  ERROR_RETURN_VALUE                         ,  \
                                      CREATED_OBJECT_ID                          ,  \
									  DESCRIPTION                                ,  \
									  TEXT_DATA                                     \
						) VALUES                                                    \
						(            ?, substrb(?,1,8)                           ,  \
						             TO_TIMESTAMP(?,'yyyy/mm/dd hh24:mi:ss:ff')  ,  \
									 TO_TIMESTAMP(?,'yyyy/mm/dd hh24:mi:ss:ff')  ,  \
									 ?, ?, ?, substr(?,1,22), substrb(?,1,255), ?                  \
                       )
                       
# 19. Adapter Error 를 TB_S60_UERR010 table 에 데이터 update
UPDATE_SERV_ERROR_INFO = UPDATE TB_S60_UERR010                                                      \
                         SET    EAI_RECEIVE_TIMESTAMP = to_timestamp(?,'yyyy/mm/dd hh24:mi:ss:ff'), \
						        EAI_SYSTEM_ID         =  ?                                        , \
								EAI_INTERFACE_ID      =  ?                                        , \
								ERROR_RETURN_VALUE    =  ?                                        , \
								CREATED_OBJECT_ID     =  ?                                          \
			             WHERE LOCAL_QUEUE_NAME   = UPPER(?) and TRANSACTION_CODE = substrb(?,1,8)  \
  						 and   EAI_SEND_TIMESTAMP = to_timestamp(?,'yyyy/mm/dd hh24:mi:ss:ff')

