                        WHERE EAI_INTERFACE_ID = ? AND TRANSACTION_CODE = substrb(?,1,8) AND SEND_RECEIVE_CODE = ? \
                        AND EAI_SYSTEM_ID = ? AND EAI_SEND_DATE = ?
						
# 2.TB_S60_SUMM010 Table 통계정보 업데이트 쿼리 
UPDATE_SUMM = UPDATE TB_S60_SUMM010 SET \
                TIME_COUNT0 = TIME_COUNT0 +   DECODE(?,'00',?,0),  \
                TIME_COUNT1 = TIME_COUNT1 +   DECODE(?,'01',?,0),  \
                TIME_COUNT2 = TIME_COUNT2 +   DECODE(?,'02',?,0),  \
                TIME_COUNT3 = TIME_COUNT3 +   DECODE(?,'03',?,0),  \
                TIME_COUNT4 = TIME_COUNT4 +   DECODE(?,'04',?,0),  \
                TIME_COUNT5 = TIME_COUNT5 +   DECODE(?,'05',?,0),  \
                TIME_COUNT6 = TIME_COUNT6 +   DECODE(?,'06',?,0),  \
                TIME_COUNT7 = TIME_COUNT7 +   DECODE(?,'07',?,0),  \
                TIME_COUNT8 = TIME_COUNT8 +   DECODE(?,'08',?,0),  \
                TIME_COUNT9 = TIME_COUNT9 +   DECODE(?,'09',?,0),  \
                TIME_COUNT10 = TIME_COUNT10 + DECODE(?,'10',?,0), \
                TIME_COUNT11 = TIME_COUNT11 + DECODE(?,'11',?,0), \
                TIME_COUNT12 = TIME_COUNT12 + DECODE(?,'12',?,0), \
                TIME_COUNT13 = TIME_COUNT13 + DECODE(?,'13',?,0), \
                TIME_COUNT14 = TIME_COUNT14 + DECODE(?,'14',?,0), \
                TIME_COUNT15 = TIME_COUNT15 + DECODE(?,'15',?,0), \
                TIME_COUNT16 = TIME_COUNT16 + DECODE(?,'16',?,0), \
                TIME_COUNT17 = TIME_COUNT17 + DECODE(?,'17',?,0), \
                TIME_COUNT18 = TIME_COUNT18 + DECODE(?,'18',?,0), \
                TIME_COUNT19 = TIME_COUNT19 + DECODE(?,'19',?,0), \
                TIME_COUNT20 = TIME_COUNT20 + DECODE(?,'20',?,0), \
                TIME_COUNT21 = TIME_COUNT21 + DECODE(?,'21',?,0), \
                TIME_COUNT22 = TIME_COUNT22 + DECODE(?,'22',?,0), \
                TIME_COUNT23 = TIME_COUNT23 + DECODE(?,'23',?,0), \
                UAP_PROCESS_TIME = MOD(((UAP_PROCESS_TIME*DATA_COUNT)+?)/(DATA_COUNT+1),1000),\
                DATA_COUNT = DATA_COUNT + ? , \
                LAST_UPDATE_TIMESTAMP = SYSTIMESTAMP                    \
                WHERE EAI_INTERFACE_ID = ? AND TRANSACTION_CODE = substrb(?,1,8)  \
				AND EAI_SEND_DATE = ? AND UPPER(EAI_SYSTEM_ID) = UPPER(?) \
			    AND SEND_RECEIVE_CODE = ?  

# 3. TB_S60_SUMM010 Table 통계정보 입력 쿼리
INSERT_SUMM = INSERT INTO TB_S60_SUMM010                        \
		 (	EAI_INTERFACE_ID        ,TRANSACTION_CODE         , \
			SEND_RECEIVE_CODE       ,EAI_SYSTEM_ID            , \
			EAI_SEND_DATE           ,APPLICATION_SHORT_NAME   , \
			SERVICE_INST_ID         ,MULTI_RECEIVE_COUNT      , \
			TIME_COUNT0             ,TIME_COUNT1              , \
			TIME_COUNT2             ,TIME_COUNT3              , \
			TIME_COUNT4             ,TIME_COUNT5              , \
			TIME_COUNT6             , \
			TIME_COUNT7             ,TIME_COUNT8              , \
			TIME_COUNT9             ,TIME_COUNT10             , \
			TIME_COUNT11            ,TIME_COUNT12             , \
			TIME_COUNT13            ,TIME_COUNT14             , \
			TIME_COUNT15            ,TIME_COUNT16             , \
			TIME_COUNT17            ,TIME_COUNT18             , \
			TIME_COUNT19            ,TIME_COUNT20             , \
			TIME_COUNT21            ,TIME_COUNT22             , \
			TIME_COUNT23            ,DATA_COUNT               , \
		    PROCESS_CHAIN_CODE   , \
		    UAP_PROCESS_TIME       \
		 )                         \
		 VALUES  (?,substrb(?,1,8),?,?,?,?,?,?, \
		  DECODE(?,'00',?,0),    DECODE(?,'01',?,0), \
		  DECODE(?,'02',?,0),   DECODE(?,'03',?,0),  \
		  DECODE(?,'04',?,0),   DECODE(?,'05',?,0),  \
		  DECODE(?,'06',?,0),   \
		  DECODE(?,'07',?,0),    DECODE(?,'08',?,0), \
		  DECODE(?,'09',?,0),    DECODE(?,'10',?,0), \
		  DECODE(?,'11',?,0),    DECODE(?,'12',?,0), \
		  DECODE(?,'13',?,0),    DECODE(?,'14',?,0), \
		  DECODE(?,'15',?,0),    DECODE(?,'16',?,0), \
		  DECODE(?,'17',?,0),    DECODE(?,'18',?,0), \
		  DECODE(?,'19',?,0),    DECODE(?,'20',?,0), \
		  DECODE(?,'21',?,0),    DECODE(?,'22',?,0), \
		  DECODE(?,'23',?,0),    ?,?,?)

