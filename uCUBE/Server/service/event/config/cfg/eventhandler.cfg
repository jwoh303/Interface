# 5. EAI_SEND_DATA 2000byte 이하 의 데이타를 넣는 쿼리 . 
INSERT_SBW_EVENT = INSERT INTO EAI_SEND_DATA                       \
                   ( SEND_DATA_SEQ_ID   , APPLICATION_SHORT_NAME , \
                     SERVICE_INST_ID    , EAI_INTERFACE_ID       , \
                     TRANSACTION_CODE   , EAI_SYSTEM_ID          , \
                     EAI_SEND_TIMESTAMP , DOCUMENT_ID            , \
                     SEND_DATA          , GENERATION_DATE        ) \
                     VALUES                                                 \
					 (?,?,?,?,substrb(?,1,8),?,                             \
				          to_timestamp(?,'yyyy/mm/dd hh24:mi:ss:ff'),       \
					      RTRIM(LTRIM(?)),EMPTY_CLOB(),SYSDATE)             

#oracle 9i 부터 dataformat 적용 가능 
# 6. EAI_SEND_DATA 2000byte 이상의 데이타를 넣는 쿼리 .
INSERT_SBW_EVENT1 = INSERT INTO EAI_SEND_DATA                      \
                   ( SEND_DATA_SEQ_ID   , APPLICATION_SHORT_NAME , \
                     SERVICE_INST_ID    , EAI_INTERFACE_ID       , \
                     TRANSACTION_CODE   , EAI_SYSTEM_ID          , \
                     EAI_SEND_TIMESTAMP , DOCUMENT_ID            , \
                     GENERATION_DATE    )                          \
                     VALUES                                        \
                    (?,?,?,?,substrb(?,1,8),?,                     \
					       to_timestamp(?,'yyyy/mm/dd hh24:mi:ss:ff'), \
						   RTRIM(LTRIM(?)),?,SYSDATE)     


