<script type="text/javascript">
/**
 * 팝업 API 생성 함수 (전역 - 모든 팝업 공통 함수명)
 * PopupUtil에서 window.createPopupAPI를 자동으로 호출하여 팝업 API 객체를 받습니다.
 *
 * @param {string} overlayId - 오버레이 ID (PopupUtil에서 자동 생성하여 전달)
 * @param {string} containerId - 컨테이너 ID (PopupUtil에서 자동 생성하여 전달)
 * @returns {Object} 팝업 API 객체
 */
window.createPopupAPI = function(overlayId, containerId) {
    var $overlay = $('#' + overlayId);
    var $container = $('#' + containerId);
    var saveCallback = null;
    var cancelCallback = null;
    var userData = null; // 로드된 사용자 데이터 저장
    var animationType = $container.data('animationType') || 'default';

    /**
     * 사용자 정보 로드
     */
    function loadUserData() {
        console.log('[Personal Info] 데이터 로드 시작');

        HttpUtil.post('/mdam/getSellerMdAmUserInfoJson.do', {}, {
            showLoader: true,
            showDefaultAlert: false
        }).then(function(response) {
            console.log('[Personal Info] 서버 응답 전체:', response);
            console.log('[Personal Info] response.data 타입:', typeof response.data);
            console.log('[Personal Info] response.data 내용:', response.data);

            // HttpUtil은 response.data에 실제 서버 JSON 응답이 담김
            var serverData = response.data;

            // 응답 구조 체크: {msg: 'OK', data: {...}} 형태
            if (serverData && serverData.msg === 'OK' && serverData.data) {
                userData = serverData.data;
                populateForm(serverData.data);
                console.log('[Personal Info] 데이터 로드 완료', serverData.data);
            } else {
                console.error('[Personal Info] 데이터 로드 실패 - 응답 구조:', serverData);
                alert((serverData && serverData.message) || '정보를 불러올 수 없습니다.');
            }
        }).catch(function(error) {
            console.error('[Personal Info] 데이터 로드 오류', error);
            alert('정보를 불러오는 중 오류가 발생했습니다.');
        });
    }

    /**
     * 데이터를 폼에 바인딩
     */
    function populateForm(data) {
        console.log('[Personal Info] 폼 바인딩 시작', data);

        // 1. 회사 정보 (data-field 속성 사용)
        $container.find('[data-field="COM_CODE"]').text(data.COM_CODE || '');
        $container.find('[data-field="COM_NAME_LOC"]').text(data.COM_NAME_LOC || '');
        $container.find('[data-field="IRS_NO"]').text(data.IRS_NO || '');

        // 2. ID
        $container.find('[data-field="USER_ID"]').text(data.USER_ID || '');

        // 3. 이름
        $container.find('input[name="user_name_loc"]').val(data.USER_NAME_LOC || '');
        $container.find('input[name="user_name_eng"]').val(data.USER_NAME_ENG || '');

        // 4. 휴대폰 (분리) - 디버깅 로그 추가
        console.log('[Personal Info] 원본 휴대폰:', data.MOBILE_PHONE);
        if (data.MOBILE_PHONE) {
            var mobilePhone = String(data.MOBILE_PHONE).trim();
            var mobileParts = [];

            // 하이픈이 있으면 split, 없으면 숫자만 추출하여 분리
            if (mobilePhone.indexOf('-') > -1) {
                mobileParts = mobilePhone.split('-');
            } else {
                // 숫자만 추출
                mobilePhone = mobilePhone.replace(/[^0-9]/g, '');
                // 010-1234-5678 형태로 분리
                if (mobilePhone.length === 11) {
                    mobileParts = [
                        mobilePhone.substring(0, 3),   // 010
                        mobilePhone.substring(3, 7),   // 1234
                        mobilePhone.substring(7, 11)   // 5678
                    ];
                } else if (mobilePhone.length === 10) {
                    mobileParts = [
                        mobilePhone.substring(0, 3),   // 010
                        mobilePhone.substring(3, 6),   // 123
                        mobilePhone.substring(6, 10)   // 4567
                    ];
                } else {
                    mobileParts = [mobilePhone, '', ''];
                }
            }

            console.log('[Personal Info] 분리된 휴대폰:', mobileParts);
            $container.find('input[name="mobile_phone1"]').val(mobileParts[0] || '');
            $container.find('input[name="mobile_phone2"]').val(mobileParts[1] || '');
            $container.find('input[name="mobile_phone3"]').val(mobileParts[2] || '');
        }

        // 5. 전화번호 (분리)
        console.log('[Personal Info] 원본 전화번호:', data.PHONE_NUMBER);
        if (data.PHONE_NUMBER) {
            var phoneNumber = String(data.PHONE_NUMBER).trim();
            var phoneParts = [];

            if (phoneNumber.indexOf('-') > -1) {
                phoneParts = phoneNumber.split('-');
            } else {
                phoneNumber = phoneNumber.replace(/[^0-9]/g, '');

                // 지역번호 02(서울)는 2자리, 나머지는 3자리
                if (phoneNumber.length === 10) {
                    if (phoneNumber.substring(0, 2) === '02') {
                        // 02-0000-0000 (2-4-4)
                        phoneParts = [
                            phoneNumber.substring(0, 2),   // 02
                            phoneNumber.substring(2, 6),   // 0000
                            phoneNumber.substring(6, 10)   // 0000
                        ];
                    } else {
                        // 031-000-0000 (3-3-4)
                        phoneParts = [
                            phoneNumber.substring(0, 3),   // 031
                            phoneNumber.substring(3, 6),   // 000
                            phoneNumber.substring(6, 10)   // 0000
                        ];
                    }
                } else if (phoneNumber.length === 9) {
                    // 02-000-0000 (2-3-4)
                    phoneParts = [
                        phoneNumber.substring(0, 2),   // 02
                        phoneNumber.substring(2, 5),   // 000
                        phoneNumber.substring(5, 9)    // 0000
                    ];
                } else {
                    phoneParts = [phoneNumber, '', ''];
                }
            }

            console.log('[Personal Info] 분리된 전화번호:', phoneParts);
            $container.find('input[name="phone1"]').val(phoneParts[0] || '');
            $container.find('input[name="phone2"]').val(phoneParts[1] || '');
            $container.find('input[name="phone3"]').val(phoneParts[2] || '');
        }

        // 6. FAX (분리)
        console.log('[Personal Info] 원본 FAX:', data.FAX_NUMBER);
        if (data.FAX_NUMBER) {
            var faxNumber = String(data.FAX_NUMBER).trim();
            var faxParts = [];

            if (faxNumber.indexOf('-') > -1) {
                faxParts = faxNumber.split('-');
            } else {
                faxNumber = faxNumber.replace(/[^0-9]/g, '');

                // 지역번호 02(서울)는 2자리, 나머지는 3자리
                if (faxNumber.length === 10) {
                    if (faxNumber.substring(0, 2) === '02') {
                        // 02-0000-0000 (2-4-4)
                        faxParts = [
                            faxNumber.substring(0, 2),   // 02
                            faxNumber.substring(2, 6),   // 0000
                            faxNumber.substring(6, 10)   // 0000
                        ];
                    } else {
                        // 031-000-0000 (3-3-4)
                        faxParts = [
                            faxNumber.substring(0, 3),   // 031
                            faxNumber.substring(3, 6),   // 000
                            faxNumber.substring(6, 10)   // 0000
                        ];
                    }
                } else if (faxNumber.length === 9) {
                    // 02-000-0000 (2-3-4)
                    faxParts = [
                        faxNumber.substring(0, 2),   // 02
                        faxNumber.substring(2, 5),   // 000
                        faxNumber.substring(5, 9)    // 0000
                    ];
                } else {
                    faxParts = [faxNumber, '', ''];
                }
            }

            console.log('[Personal Info] 분리된 FAX:', faxParts);
            $container.find('input[name="fax1"]').val(faxParts[0] || '');
            $container.find('input[name="fax2"]').val(faxParts[1] || '');
            $container.find('input[name="fax3"]').val(faxParts[2] || '');
        }

        // 7. 이메일
        $container.find('input[name="email"]').val(data.EMAIL || '');

        // 8. 알림수신 체크박스
        // DB 컬럼: MAIL_RECV_FLAG (이메일), SMS_RECV_FLAG (문자)
        console.log('[Personal Info] 알림수신 데이터 - 이메일:', data.MAIL_RECV_FLAG, '문자:', data.SMS_RECV_FLAG);

        var mailRecvFlag = data.MAIL_RECV_FLAG === 'Y';
        var smsRecvFlag = data.SMS_RECV_FLAG === 'Y';
        
        $container.find('input[name="recv_email"]').prop('checked', mailRecvFlag);
        $container.find('input[name="recv_sms"]').prop('checked', smsRecvFlag);
        
     	// 9. 2차인증 여부
        // DB 컬럼: TWO_FACTOR_YN(2차인증 여부)
        console.log('[Personal Info] 알림수신 데이터 - 2차인증 여부:', data.TWO_FACTOR_YN);
		
        $container.find("input[name='two_factor_yn'][value='"+ data.TWO_FACTOR_YN +"']").prop("checked", true);      

        console.log('[Personal Info] 폼 바인딩 완료');

        // ValidationManager 동적 로드 및 팝업 필드만 등록
        function initValidationManager() {
            if (typeof ValidationManager !== 'undefined') {
                console.log('[Personal Info] ValidationManager 이미 로드됨, 팝업 필드만 등록 시작');

                // 팝업 컨테이너 내부의 필드만 검증 규칙 등록
                registerPopupFields();
                console.log('[Personal Info] 팝업 필드 등록 완료');
            } else {
                console.log('[Personal Info] ValidationManager 로드 중...');
                // 캐시 버스팅: 타임스탬프 추가하여 항상 최신 버전 로드
                $.getScript('/resources/js/ValidationManager.js?v=' + new Date().getTime())
                    .done(function() {
                        console.log('[Personal Info] ValidationManager.js 로드 성공');
                        setTimeout(function() {
                            // 전역 초기화
                            ValidationManager.init({
                                autoValidate: true,
                                realtime: true,
                                scrollOnError: true,
                                showSuccessState: false
                            });
                            // 팝업 필드만 등록
                            registerPopupFields();
                            console.log('[Personal Info] ValidationManager 초기화 및 팝업 필드 등록 완료');
                        }, 100);
                    })
                    .fail(function() {
                        console.error('[Personal Info] ValidationManager.js 로드 실패!');
                    });
            }
        }

        // 팝업 컨테이너 내부의 필드만 ValidationManager에 등록
        function registerPopupFields() {
            // 팝업 컨테이너 내부의 [data-validate] 필드만 선택
            var popupFields = $container.find('[data-validate]');
            console.log('[Personal Info] 팝업 내부 필드 수:', popupFields.length);

            popupFields.each(function() {
                var field = $(this)[0];
                var fieldId = field.id;
                var fieldName = field.name;
                var validateStr = field.getAttribute('data-validate');
                var errorMessage = field.getAttribute('data-error-message');

                // ID가 없으면 name 속성으로 임시 ID 생성
                if (!fieldId && fieldName) {
                    fieldId = 'popup_' + fieldName;
                    field.id = fieldId;
                    console.log('[Personal Info] 필드에 임시 ID 생성:', fieldId);
                }

                if (!fieldId || !validateStr) {
                    console.log('[Personal Info] 스킵된 필드:', fieldName || field.tagName);
                    return;
                }

                // 검증 규칙 파싱
                var ruleObj = ValidationManager.parseValidationString(validateStr);
                if (errorMessage) {
                    ruleObj.errorMessage = errorMessage;
                }

                // 검증 규칙 추가
                ValidationManager.addRule(fieldId, ruleObj);
                console.log('[Personal Info] 필드 등록:', fieldId, '규칙:', validateStr);
            });
        }

        // ValidationManager 초기화 실행
        setTimeout(initValidationManager, 100);

        // 숫자만 입력 가능하도록 설정 (휴대폰, 전화번호, FAX)
        var numericFields = [
            'mobile_phone1', 'mobile_phone2', 'mobile_phone3',
            'phone1', 'phone2', 'phone3',
            'fax1', 'fax2', 'fax3'
        ];

        numericFields.forEach(function(fieldName) {
            var field = $container.find('input[name="' + fieldName + '"]')[0];
            if (field) {
                // input 이벤트: 입력 중 숫자가 아닌 문자 제거
                field.addEventListener('input', function(e) {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });

                // keypress 이벤트: 숫자 키만 허용 (엔터, 백스페이스, 탭 등은 허용)
                field.addEventListener('keypress', function(e) {
                    var charCode = e.which || e.keyCode;
                    // 숫자(48-57), 엔터(13), 백스페이스(8), 탭(9)만 허용
                    if (charCode > 31 && (charCode < 48 || charCode > 57)) {
                        e.preventDefault();
                        return false;
                    }
                    return true;
                });

                // paste 이벤트: 붙여넣기 시 숫자만 허용
                field.addEventListener('paste', function(e) {
                    e.preventDefault();
                    var pastedText = (e.clipboardData || window.clipboardData).getData('text');
                    var numericText = pastedText.replace(/[^0-9]/g, '');
                    this.value = numericText.substring(0, parseInt(this.getAttribute('maxlength') || '999'));
                });
            }
        });
    }

    /**
     * 팝업 닫기 (애니메이션 포함)
     */
    function close() {
        var $popup = $container.find('.DIVpopup');

        // 이미 닫기 애니메이션 중이면 무시
        if ($popup.hasClass('popup-button-exit') || $popup.hasClass('popup-exit')) {
            return;
        }

        // 팝업 필드를 ValidationManager에서 제거
        if (typeof ValidationManager !== 'undefined') {
            $container.find('[data-validate]').each(function() {
                var field = $(this)[0];
                var fieldId = field.id;

                if (!fieldId && field.name) {
                    fieldId = 'popup_' + field.name;
                }

                if (fieldId) {
                    ValidationManager.removeRule(fieldId);
                    console.log('[Personal Info] 필드 제거:', fieldId);
                }
            });
        }

        // 애니메이션 타입에 따른 클래스 결정
        var exitClass = animationType === 'fromButton' ? 'popup-button-exit' : 'popup-exit';
        var animationDuration = animationType === 'fromButton' ? 1000 : 200;

        // 열기 애니메이션 클래스 제거 후 닫기 애니메이션 적용
        $popup.removeClass('popup-enter popup-button-enter').addClass(exitClass);
        $overlay.removeClass('popup-enter').addClass('popup-exit');

        // 애니메이션 완료 후 제거
        setTimeout(function() {
            $overlay.remove();
            $container.remove();

            // ✅ body 스크롤 복원 (모든 팝업이 닫혔는지 확인)
            if ($('[id^="popup-overlay-"]').length === 0) {
                var scrollY = $('body').data('scrollY') || 0;
                $('body').css({
                    'position': '',
                    'top': '',
                    'left': '',
                    'right': '',
                    'overflow-y': ''
                });
                window.scrollTo(0, scrollY);
                console.log('[Personal Info Popup] body 스크롤 복원');
            }

            console.log('[Personal Info Popup] 팝업 닫힘 및 필드 정리 완료');
        }, animationDuration);
    }

    /**
     * 비밀번호 유효성 검사
     */
    function validatePassword() {
        var currentPwd = $container.find('input[name="password_current"]').val();
        var newPwd = $container.find('input[name="password_new"]').val();
        var confirmPwd = $container.find('input[name="password_confirm"]').val();

        // 1. 현재 비밀번호 입력 확인
        if (!currentPwd || currentPwd.trim() === '') {
            alert('현재 비밀번호가 입력되지 않았습니다.');
            $container.find('input[name="password_current"]').focus();
            return false;
        }

        // 2. 새 비밀번호 입력 확인
        if (!newPwd || newPwd.trim() === '') {
            alert('비밀번호가 입력되지 않았습니다.');
            $container.find('input[name="password_new"]').focus();
            return false;
        }

        // 3. 공백 문자 체크
        if (/\s/.test(newPwd)) {
            alert('비밀번호에 공백문자는 입력할 수 없습니다.');
            $container.find('input[name="password_new"]').val('');
            $container.find('input[name="password_new"]').focus();
            return false;
        }

        // 4. 길이 체크 (8자 이상)
        if (newPwd.length < 8) {
            alert('비밀번호는 8자리 이상 사용해야 합니다.');
            $container.find('input[name="password_new"]').focus();
            return false;
        }

        // 5. 한글 체크
        if (/[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(newPwd)) {
            alert('비밀번호는 영문으로 입력해 주십시요.');
            $container.find('input[name="password_new"]').focus();
            return false;
        }

        // 6. 비밀번호 확인 입력 확인
        if (!confirmPwd || confirmPwd.trim() === '') {
            alert('비밀번호가 입력되지 않았습니다.');
            $container.find('input[name="password_confirm"]').focus();
            return false;
        }

        // 7. 비밀번호 확인 공백 체크
        if (/\s/.test(confirmPwd)) {
            alert('비밀번호에 공백문자는 입력할 수 없습니다.');
            $container.find('input[name="password_confirm"]').val('');
            $container.find('input[name="password_confirm"]').focus();
            return false;
        }

        // 8. 비밀번호 확인 길이 체크
        if (confirmPwd.length < 8) {
            alert('비밀번호는 8자리 이상 사용해야 합니다.');
            $container.find('input[name="password_confirm"]').focus();
            return false;
        }

        // 9. 비밀번호 확인 한글 체크
        if (/[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(confirmPwd)) {
            alert('비밀번호는 영문으로 입력해 주십시요.');
            $container.find('input[name="password_confirm"]').focus();
            return false;
        }

        // 10. 현재 비밀번호와 새 비밀번호 동일 여부 체크
        if (currentPwd === newPwd) {
            alert('새 비밀번호는 현재 비밀번호와 달라야 합니다.');
            $container.find('input[name="password_new"]').focus();
            return false;
        }

        // 11. 비밀번호 일치 확인
        if (newPwd !== confirmPwd) {
            alert('비밀번호가 일치하지 않습니다.\n다시 한번 입력하시기 바랍니다.');
            $container.find('input[name="password_new"]').focus();
            return false;
        }

        return true;
    }

    /**
     * 비밀번호 변경 처리
     */
    function handlePasswordChange() {
        console.log('[Personal Info] 비밀번호 변경 시작');

        // 1. 유효성 검사
        if (!validatePassword()) {
            return;
        }

        var currentPwd = $container.find('input[name="password_current"]').val();
        var newPwd = $container.find('input[name="password_new"]').val();

        // 2. 비밀번호 규칙 검증 (서버)
        HttpUtil.post('/mdam/pwdValidCheckSellerMdAmUserInfoList.do', {
            st_user_id: userData.USER_ID,
            st_password: newPwd
        }, {
            showLoader: true,
            showDefaultAlert: false
        }).then(function(response) {
            console.log('[Personal Info] 비밀번호 규칙 검증 응답:', response);

            // HttpUtil은 response.data에 실제 서버 JSON 응답이 담김
            var serverData = response.data;
            console.log('[Personal Info] 비밀번호 규칙 검증 serverData:', serverData);

            if (serverData && serverData.msg === 'OK') {
                // 3. 규칙 검증 통과 - 사용자 확인 후 저장
                if (confirm('비밀번호를 수정 하시겠습니까?')) {
                    savePassword(currentPwd, newPwd);
                }
            } else {
                // 규칙 검증 실패
                var errorMsg = (serverData && serverData.msg) ? serverData.msg : '비밀번호 규칙 검증에 실패했습니다.';
                alert(errorMsg);
                $container.find('input[name="password_new"]').val('');
                $container.find('input[name="password_new"]').focus();
            }
        }).catch(function(error) {
            console.error('[Personal Info] 비밀번호 규칙 검증 오류:', error);
            alert('비밀번호 검증 중 오류가 발생했습니다.');
        });
    }

    /**
     * 비밀번호 저장
     */
    function savePassword(currentPwd, newPwd) {
        console.log('[Personal Info] 비밀번호 저장 시작');

        HttpUtil.post('/mdam/saveSellerMdAmUsePwd_v2.do', {
            st_password_present: currentPwd,  // 현재 비밀번호 (레거시 파라미터명)
            st_password: newPwd               // 새 비밀번호 (레거시 파라미터명)
        }, {
            showLoader: true,
            showDefaultAlert: false
        }).then(function(response) {
            console.log('[Personal Info] 비밀번호 저장 응답:', response);

            // HttpUtil은 response.data에 실제 서버 JSON 응답이 담김
            var serverData = response.data;
            console.log('[Personal Info] 비밀번호 저장 serverData:', serverData);

            if (serverData && serverData.msg === 'OK') {
                alert('비밀번호 변경이 완료되었습니다.');
                // 비밀번호 입력 필드 초기화
                $container.find('input[name="password_current"]').val('');
                $container.find('input[name="password_new"]').val('');
                $container.find('input[name="password_confirm"]').val('');
            } else if (serverData && serverData.msg === 'ERR_MATCH') {
                alert('현재 비밀번호가 일치하지 않습니다.');
                $container.find('input[name="password_current"]').focus();
            } else if (serverData && serverData.msg === 'ERR_SAME_PASSWORD') {
                alert('새 비밀번호는 현재 비밀번호와 달라야 합니다.');
                $container.find('input[name="password_new"]').focus();
            } else if (serverData && serverData.msg === 'ERR') {
                alert('비밀번호 변경이 실패 하였습니다.\n다시 확인하여 주십시요!');
            } else {
                var errorMsg = (serverData && serverData.msg) ? serverData.msg : '비밀번호 변경 중 오류가 발생했습니다.';
                alert(errorMsg);
            }
        }).catch(function(error) {
            console.error('[Personal Info] 비밀번호 저장 오류:', error);
            alert('비밀번호 변경 중 오류가 발생했습니다.');
        });
    }

    /**
     * 개인정보 유효성 검사 (팝업 필드만 검증)
     */
    function validatePersonalInfo() {
        console.log('[Personal Info] 팝업 필드 유효성 검사 시작');

        if (typeof ValidationManager === 'undefined') {
            console.error('[Personal Info] ValidationManager가 로드되지 않았습니다!');
            alert('유효성 검사 모듈이 로드되지 않았습니다.');
            return false;
        }

        var isValid = true;
        var firstErrorField = null;

        // 팝업 컨테이너 내부의 [data-validate] 필드만 검증
        $container.find('[data-validate]').each(function() {
            var field = $(this)[0];
            var fieldId = field.id;

            if (!fieldId) {
                // ID가 없으면 생성된 임시 ID 사용
                fieldId = field.name ? 'popup_' + field.name : null;
            }

            if (fieldId) {
                var fieldIsValid = ValidationManager.validateField(fieldId);
                console.log('[Personal Info] 필드 검증:', fieldId, '결과:', fieldIsValid);

                if (!fieldIsValid) {
                    isValid = false;
                    if (!firstErrorField) {
                        firstErrorField = field;
                    }
                }
            }
        });

        // 첫 번째 에러 필드로 스크롤 및 포커스
        if (!isValid && firstErrorField) {
            firstErrorField.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(function() {
                firstErrorField.focus();
            }, 300);
        }

        console.log('[Personal Info] 전체 검증 결과:', isValid);
        return isValid;
    }

    /**
     * 개인정보 저장
     */
    function handlePersonalInfoSave() {
        console.log('[Personal Info] 저장 시작');

        // 1. 비밀번호 입력 필드 체크
        var currentPwd = $container.find('input[name="password_current"]').val();
        var newPwd = $container.find('input[name="password_new"]').val();
        var confirmPwd = $container.find('input[name="password_confirm"]').val();

        if (currentPwd || newPwd || confirmPwd) {
            alert('비밀번호 변경이 이루어지지 않았습니다.');
            return;
        }

        // 2. 유효성 검사
        if (!validatePersonalInfo()) {
            return;
        }

        // 3. 사용자 확인
        if (!confirm('사용자 정보를 수정 하시겠습니까?')) {
            return;
        }
        
        // 4. 폼 데이터 수집
        var formData = {
            st_user_id: userData.USER_ID,
            st_com_code: userData.COM_CODE,
            st_user_name_loc: $container.find('input[name="user_name_loc"]').val(),
            st_user_name_eng: $container.find('input[name="user_name_eng"]').val(),
            st_email: $container.find('input[name="email"]').val(),

            // 휴대폰 (3칸 합치기)
            st_mobile_phone: $container.find('input[name="mobile_phone1"]').val() + '-' +
                            $container.find('input[name="mobile_phone2"]').val() + '-' +
                            $container.find('input[name="mobile_phone3"]').val(),

            // 전화번호 (3칸 합치기)
            st_phone_number: $container.find('input[name="phone1"]').val() + '-' +
                            $container.find('input[name="phone2"]').val() + '-' +
                            $container.find('input[name="phone3"]').val(),

            // FAX (3칸 합치기)
            st_fax_number: $container.find('input[name="fax1"]').val() + '-' +
                          $container.find('input[name="fax2"]').val() + '-' +
                          $container.find('input[name="fax3"]').val(),

            // 알림수신 (체크박스 2개)
            st_mail_recv_flag: $container.find('input[name="recv_email"]').prop('checked') ? 'Y' : 'N',
            st_sms_recv_flag: $container.find('input[name="recv_sms"]').prop('checked') ? 'Y' : 'N',

            // 레거시 필드 (기존 값 유지)
            st_lang: userData.LANG || 'KR',
            st_user_type: userData.USER_TYPE,
            change_user_type: userData.USER_TYPE,
            st_country_code: userData.COUNTRY || 'KR',
            st_city_code: userData.CITY || 'KRSEL',
            st_zip_code: userData.ZIP_CODE || '',
            st_zip_key: userData.ZIP_KEY || '',
            st_address: userData.ADDRESS_LOC1 || '',
            st_address_dt: userData.ADDRESS_LOC2 || '',
            st_department: userData.DEPARTMENT || '',
            st_position: userData.POSITION || '',
            st_two_factor_flag: $container.find('input[name="two_factor_yn"]:checked').val(),            
            st_old_two_factor_flag: userData.TWO_FACTOR_YN
        };

        console.log('[Personal Info] 저장할 데이터:', formData);

        // 5. 서버 저장 요청
        HttpUtil.post('/mdam/saveSellerMdAmUserInfoList.do', formData, {
            showLoader: true,
            showDefaultAlert: false
        }).then(function(response) {
            console.log('[Personal Info] 저장 응답:', response);

            var serverData = response.data;

            if (serverData && serverData.msg === 'OK') {
                alert('사용자 정보 수정이 완료되었습니다.');

                // 비밀번호 입력 필드 초기화 (보안상 중요)
                $container.find('input[name="password_current"]').val('');
                $container.find('input[name="password_new"]').val('');
                $container.find('input[name="password_confirm"]').val('');

                // 데이터 다시 로드
                loadUserData();
            } else if (serverData && serverData.msg === 'ERR') {
                alert('사용자 정보 수정이 실패 하였습니다.\n다시 확인하여 주십시요!');
            } else {
                var errorMsg = (serverData && serverData.msg) ? serverData.msg : '저장 중 오류가 발생했습니다.';
                alert(errorMsg);
            }
        }).catch(function(error) {
            console.error('[Personal Info] 저장 오류:', error);
            alert('저장 중 오류가 발생했습니다.');
        });
    }

    /**
     * 저장 버튼 클릭 콜백 설정
     */
    function onSave(callback) {
        saveCallback = callback;
        return api; // 체이닝 지원
    }

    /**
     * 취소(닫기) 콜백 설정
     */
    function onCancel(callback) {
        cancelCallback = callback;
        return api; // 체이닝 지원
    }

    /**
     * 이벤트 바인딩 (자동 실행)
     */
    function bindEvents() {
        // 기존 이벤트 제거 (중복 방지)
        $container.find('#closePopupBtn').off('click');
        $container.find('#cancelBtn').off('click');
        $container.find('#saveBtn').off('click');
        $overlay.off('click');

        // X 버튼 클릭 이벤트
        $container.find('#closePopupBtn').on('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (cancelCallback) cancelCallback();
            close();
        });

        // 취소 버튼 클릭 이벤트
        $container.find('#cancelBtn').on('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (cancelCallback) cancelCallback();
            close();
        });

        // 비밀번호 변경 버튼 클릭 이벤트
        $container.find('#changePasswordBtn').on('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            handlePasswordChange();
        });

        // 저장 버튼 클릭 이벤트
        $container.find('#saveBtn').on('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            handlePersonalInfoSave();
        });

        // 오버레이 클릭 시 닫기
        $overlay.on('click', function() {
            if (cancelCallback) cancelCallback();
            close();
        });

        console.log('[Personal Info Popup] 이벤트 자동 바인딩 완료');
    }

    // Public API 객체를 먼저 선언 (호이스팅 문제 해결)
    var api = {};

    // Public API 속성 할당
    api.loadUserData = loadUserData;
    api.onSave = onSave;
    api.onCancel = onCancel;
    api.close = close;
    api.$overlay = $overlay;
    api.$container = $container;

    // ========================================
    // 자동 실행: 이벤트 즉시 바인딩
    // ========================================
    bindEvents();

    // ========================================
    // 자동 실행: 데이터 로드 (초기화 시)
    // ========================================
    loadUserData();

    return api;
};
</script>
