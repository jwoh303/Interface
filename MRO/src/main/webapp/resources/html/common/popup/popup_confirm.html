
    
<div class="DIVpopup-overlay" id="DIVpopupOverlay" ></div>
    <div class="DIVpopup" id="DIVpopup">
      <div class="wrapPopupText"  >
        <div class="PopupTit"> <span><a href="#" id="DIVclosePopup"><img src="/resources/imgs/Icon_close.png" /></a></span></div>
        <div class="h15"></div>
        <div class="AlertTxt"> </div>
        <div class="h30"></div>
        <div class="PopupListBtnBox_Center">
           <button class="ButPrimary_large" style="width:125px">확인</button>
        </div>  
      </div>            
    </div> 
    


<script type="text/javascript">

window.createPopupAPI = function(overlayId, containerId, options) {
    var $overlay = $('#' + overlayId);
    var $container = $('#' + containerId);
    var confirmCallback = null;
    var cancelCallback = null;
    var animationType = $container.data('animationType') || 'default';
    
     function hide(){
    	
    	$container.hide();
    	
    }
    
    function show(){
    	
    	$container.show();
    	
    }
    

    /**
     * 팝업 닫기 (애니메이션 포함)
     */
    function close() {
        var $popup = $container.find('.DIVpopup');

        // 이미 닫기 애니메이션 중이면 무시
        if ($popup.hasClass('popup-button-exit') || $popup.hasClass('popup-exit')) {
            return;
        }

        // 애니메이션 타입에 따른 클래스 결정
        var exitClass = animationType === 'fromButton' ? 'popup-button-exit' : 'popup-exit';
        var animationDuration = animationType === 'fromButton' ? 1000 : 200;

        // 열기 애니메이션 클래스 제거 후 닫기 애니메이션 적용
        $popup.removeClass('popup-enter popup-button-enter').addClass(exitClass);
        $overlay.removeClass('popup-enter').addClass('popup-exit');

        // 애니메이션 완료 후 제거
        setTimeout(function() {
            // 키보드 이벤트 해제
            $(document).off('keydown', handleKeydown);

            $overlay.remove();
            $container.remove();

            // ✅ body 스크롤 복원 (모든 팝업이 닫혔는지 확인)
            if ($('[id^="popup-overlay-"]').length === 0) {
                var scrollY = $('body').data('scrollY') || 0;
                $('body').css({
                    'position': '',
                    'top': '',
                    'left': '',
                    'right': '',
                    'overflow-y': ''
                });
                window.scrollTo(0, scrollY);
                console.log('[Confirm Popup] body 스크롤 복원');
            }

            console.log('[Confirm Popup] 팝업 닫힘');
        }, animationDuration);
    }

    /**
     * 메시지 설정
     */
    function setMessage(message) {
        if (message) {
            $container.find('.AlertTxt').html(message);
            console.log('[Confirm Popup] 메시지 설정:', message);
            $container.show();
        }
        return api; // 체이닝 지원
    }

    /**
     * 확인 버튼 클릭 콜백 설정
     */
    function onConfirm(callback) {
        confirmCallback = callback;
        return api; // 체이닝 지원
    }

    /**
     * 취소(닫기) 콜백 설정
     */
    function onCancel(callback) {
        cancelCallback = callback;
        return api; // 체이닝 지원
    }

    /**
     * 키보드 이벤트 핸들러 (Enter, Space 키로 닫기)
     */
    function handleKeydown(e) {
        // Enter(13) 또는 Space(32) 키 감지
        if (e.keyCode === 13 || e.keyCode === 32) {
            e.preventDefault();
            if (confirmCallback) confirmCallback();
            close();
        }
    }

    /**
     * 이벤트 바인딩 (내부 함수, 자동 실행)
     */
    function bindEvents() {
        // 기존 이벤트 제거 (중복 방지)
        $container.find('#DIVclosePopup').off('click');
        $container.find('.ButPrimary_large').off('click');
        $overlay.off('click');
        $(document).off('keydown', handleKeydown);

        // X 버튼 클릭 이벤트
        $container.find('#DIVclosePopup').on('click', function(e) {
            e.preventDefault();
            if (cancelCallback) cancelCallback();
            close();
        });

        // 확인 버튼 클릭 이벤트
        $container.find('.ButPrimary_large').on('click', function(e) {
            e.preventDefault();
            if (confirmCallback) confirmCallback();
            close();
        });

        // 오버레이 클릭 시 닫기
        $overlay.on('click', function() {
            if (cancelCallback) cancelCallback();
            close();
        });

        // Enter, Space 키 입력 시 닫기
        $(document).on('keydown', handleKeydown);

        console.log('[Confirm Popup] 이벤트 자동 바인딩 완료 (키보드 지원 포함)');
    }

    // Public API
    var api = {
        setMessage: setMessage,
        onConfirm: onConfirm,
        onCancel: onCancel,
        close: close,
        $overlay: $overlay,
        $container: $container
    };

    // ========================================
    // 자동 실행: 이벤트 즉시 바인딩
    // ========================================
    bindEvents();
    hide();
    return api;
};
</script>
