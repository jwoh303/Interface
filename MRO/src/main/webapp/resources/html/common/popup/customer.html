

<div class="DIVpopup-overlay" id="DIVpopupOverlay"></div>
<div class="DIVpopup" id="DIVpopup" style="width: 800px; height: 600px; max-height: 80vh; overflow: hidden;">
  <div class="wrapPopup" style="height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 20px;">
    <div class="PopupTit" style="flex-shrink: 0;">고객사 선택<span><a href="#" id="DIVclosePopup"><img src="/resources/imgs/Icon_close.png" /></a></span></div>
    <div class="h10" style="flex-shrink: 0;"></div>
    <div class="SearchPopupInputBox" style="flex-shrink: 0;">
      <form class="SearchPopupInput" onSubmit="return false;" style="width:100%">
        <input type="text" placeholder="고객사명" id="customerSearchInput" style="width:85%;">
        <button type="submit" id="customerSearchBtn">고객사검색버튼</button>
      </form>
    </div>

    <!-- 테이블 영역 (IBSheetTablePopup 스타일 사용) -->
    <div class="IBSheetPopup" style="flex: 1; min-height: 0; margin-top: 10px; overflow-y: auto; overflow-x: hidden; border: 1px solid #ddd; border-radius: 4px;">
      <div style="min-height: min-content;">
        <table class="IBSheetTablePopup" id="customerTable" style="width:100%;">
          <colgroup>
            <col width="10%" />
            <col width="60%" />
            <col width="30%" />
          </colgroup>
          <thead>
            <tr>
              <th></th>
              <th>고객사명</th>
              <th>확정마감건수</th>
            </tr>
          </thead>
          <tbody id="customerTableBody">
            <!-- 동적으로 데이터 로드 -->
          </tbody>
        </table>
      </div>
    </div>

    <div style="flex-shrink: 0; height: 20px;"></div>
    <div class="PopupListBtnBox_Center" style="flex-shrink: 0;">
      <button class="ButPrimary_large" id="confirmBtn">확인</button>
    </div>
  </div><!-- wrapPopup 끝-->
</div>

<style>
/* 팝업 전체 레이아웃 - 높이 고정 필수 */

#customerTableBody{
margin-top:10px;

}

#DIVpopup {
  display: flex;
  flex-direction: column;
  min-height: 600px !important;
  max-height: 80vh !important;
}

.wrapPopup {
  height: 100% !important;
  max-height: 100% !important;
  overflow: hidden !important;
}

.IBSheetTablePopup {
  width: 100%;
  height: auto;
  border-collapse: collapse;
  table-layout: fixed;
}

.IBSheetTablePopup tbody {
  display: table-row-group;
  height: auto;
}

.IBSheetTablePopup thead {
  position: sticky;
 top: -3px;

  z-index: 100;
  border-radius: 10px;
}

.IBSheetTablePopup thead tr {
  position: sticky;
 top: -3px;
  box-sizing: border-box;
    border-radius: 10px;
}

.IBSheetTablePopup thead th {
  background-color: #f8f9fa;
  height: 40px;
  padding: 0 8px;
  font-weight: bold;
  text-align: center;
  white-space: nowrap;
  vertical-align: middle;
  line-height: 40px;
 
      z-index: 100;
}

.IBSheetTablePopup tbody tr {
  cursor: pointer;
  transition: background-color 0.2s;
  height: 30px;
  max-height: 30px;
  z-index:99;
}

.IBSheetTablePopup tbody tr:hover {
  background-color: #f1f3f5;
}

.IBSheetTablePopup tbody td {
  height: 30px;
  max-height: 30px;
  padding: 0 8px;
  vertical-align: middle;
  border-bottom: 1px solid #dee2e6;
  text-align: center;
  line-height: 30px;
}

/* 체크박스 셀 - table-cell 유지 */
.IBSheetTablePopup tbody tr:not(.loading-row):not(.message-row) td:nth-child(1) {
  text-align: center;
  vertical-align: middle;
  padding: 0;
  line-height: normal;
}

/* 로딩/메시지 row는 일반 table-cell 유지 */
.IBSheetTablePopup tbody tr.loading-row td,
.IBSheetTablePopup tbody tr.message-row td {
  display: table-cell !important;
  text-align: center;
  vertical-align: middle;
}

/* 로딩 row는 border 제거 */
.IBSheetTablePopup tbody tr.loading-row td {
  border-bottom: none !important;
}

.IBSheetTablePopup tbody td:nth-child(2) {
  text-align: left;
}

.IBSheetTablePopup tbody td:nth-child(3) {
  text-align: right;
}

/* CheckCellMediumLabel - renewal base.css와 100% 동일 */
.CheckCellMediumLabel {
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  margin: 0;  /* 셀 중앙 정렬을 위해 margin 제거 */
  font-size: 14px;
  letter-spacing: -0.2px;
  font-weight: 400;
  color: #404046;
  vertical-align: middle;
}

.CheckCellMediumLabel input[type="checkbox"],
.CheckCellMediumLabel input[type="radio"] {
  display: none;
}

.CheckCellMediumCustom {
  position: relative;
  margin-right: 0;  /* 셀 중앙 정렬을 위해 margin 제거 */
  width: 22px;
  height: 22px;
  border: 1px solid #d7d7d7;
  border-radius: 4px;
  transition: all 0.2s ease;
  background-image: url('/resources/imgs/Check_gray.png');
  background-size: contain;
  background-color: #fff;
}

.CheckCellMediumLabel input[type="checkbox"]:checked + .CheckCellMediumCustom,
.CheckCellMediumLabel input[type="radio"]:checked + .CheckCellMediumCustom {
  background-color: #2172EC;
  border-color: #2172EC;
}

.CheckCellMediumLabel input[type="checkbox"]:checked + .CheckCellMediumCustom::after,
.CheckCellMediumLabel input[type="radio"]:checked + .CheckCellMediumCustom::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 22px;
  height: 22px;
  background-image: url('/resources/imgs/Check_white.png');
  background-size: contain;
  background-repeat: no-repeat;
}

.CheckCellMediumLabel input[type="checkbox"]:disabled + .CheckCellMediumCustom,
.CheckCellMediumLabel input[type="radio"]:disabled + .CheckCellMediumCustom {
  background-color: #ebecf2;
  border-color: #dedede;
  cursor: not-allowed;
  background-image: url('/resources/imgs/Check_gray.png');
  background-size: contain;
}

.CheckCellMediumLabel input[type="checkbox"]:disabled:checked + .CheckCellMediumCustom,
.CheckCellMediumLabel input[type="radio"]:disabled:checked + .CheckCellMediumCustom {
  background-color: #b0b0b0;
  border-color: #b0b0b0;
  color: #919298;
}

.CheckCellMediumLabel input[type="checkbox"]:disabled + .CheckCellMediumCustom::after,
.CheckCellMediumLabel input[type="radio"]:disabled + .CheckCellMediumCustom::after {
  opacity: 0.6;
}

/* 로딩 애니메이션 */
@keyframes shimmer {
  0% { color: #6c757d; }
  50% { color: rgba(255,255,255,1); text-shadow: 0 0 10px rgba(255,255,255,1); }
  100% { color: #6c757d; }
}

.loading-text span {
  animation: shimmer 1.5s ease-in-out infinite;
}

.loading-text span:nth-child(1) { animation-delay: 0s; }
.loading-text span:nth-child(2) { animation-delay: 0.1s; }
.loading-text span:nth-child(3) { animation-delay: 0.2s; }
.loading-text span:nth-child(4) { animation-delay: 0.3s; }
.loading-text span:nth-child(5) { animation-delay: 0.4s; }
.loading-text span:nth-child(6) { animation-delay: 0.5s; }
</style>

<script type="text/javascript">
/**
 * 팝업 API 생성 함수 (전역 - 모든 팝업 공통 함수명)
 * PopupUtil에서 window.createPopupAPI를 자동으로 호출하여 팝업 API 객체를 받습니다.
 * 이벤트는 자동으로 초기화되므로 init() 호출 불필요
 *
 * @param {string} overlayId - 오버레이 ID (PopupUtil에서 자동 생성하여 전달)
 * @param {string} containerId - 컨테이너 ID (PopupUtil에서 자동 생성하여 전달)
 * @returns {Object} 팝업 API 객체
 */
window.createPopupAPI = function(overlayId, containerId) {
    var $overlay = $('#' + overlayId);
    var $container = $('#' + containerId);
    var confirmCallback = null;
    var cancelCallback = null;
    var allowMultiple = false; // 단일/다중 선택 모드
    var animationType = $container.data('animationType') || 'default';
    var customerData = []; // 전체 고객사 데이터 (서버에서 로드)
    var allData = []; // 검색 필터링용 전체 데이터
    var apiUrl = '/common/commonList_v2.do'; // 기본 API URL
    var businessCond = 'B'; // B: 고객사, S: 협력사

    // Public API 객체를 먼저 선언 (호이스팅 문제 해결)
    var api = {};

    /**
     * 팝업 닫기 (애니메이션 포함)
     */
    function close() {
        var $popup = $container.find('.DIVpopup');

        // 이미 닫기 애니메이션 중이면 무시
        if ($popup.hasClass('popup-button-exit') || $popup.hasClass('popup-exit')) {
            return;
        }

        // 애니메이션 타입에 따른 클래스 결정
        var exitClass = animationType === 'fromButton' ? 'popup-button-exit' : 'popup-exit';
        var animationDuration = animationType === 'fromButton' ? 1000 : 200;

        // 열기 애니메이션 클래스 제거 후 닫기 애니메이션 적용
        $popup.removeClass('popup-enter popup-button-enter').addClass(exitClass);
        $overlay.removeClass('popup-enter').addClass('popup-exit');

        // 애니메이션 완료 후 제거
        setTimeout(function() {
            $overlay.remove();
            $container.remove();

            // ✅ body 스크롤 복원 (모든 팝업이 닫혔는지 확인)
            if ($('[id^="popup-overlay-"]').length === 0) {
                var scrollY = $('body').data('scrollY') || 0;
                $('body').css({
                    'position': '',
                    'top': '',
                    'left': '',
                    'right': '',
                    'overflow-y': ''
                });
                window.scrollTo(0, scrollY);
                console.log('[Customer Popup] body 스크롤 복원');
            }

            console.log('[Customer Popup] 팝업 닫힘');
        }, animationDuration);
    }

    /**
     * 다중 선택 허용 설정
     */
    function setAllowMultiple(allow) {
        allowMultiple = allow;
        console.log('[Customer Popup] 다중 선택 모드:', allowMultiple);
        return api; // 체이닝 지원
    }

    /**
     * API URL 설정
     */
    function setApiUrl(url) {
        apiUrl = url;
        console.log('[Customer Popup] API URL 설정:', apiUrl);
        return api;
    }

    /**
     * 업무구분 설정 (B: 고객사, S: 협력사)
     */
    function setBusinessCond(cond) {
        businessCond = cond;
        console.log('[Customer Popup] 업무구분 설정:', businessCond);
        return api;
    }

    /**
     * 고객사 데이터 설정 (임시 데이터 - 서버 로드 우선)
     */
    function setCustomerData(data) {
        customerData = data || [];
        allData = customerData;
        renderCustomerList(customerData);
        console.log('[Customer Popup] 고객사 데이터 설정:', customerData.length, '건');
        return api; // 체이닝 지원
    }

    /**
     * 서버에서 고객사 데이터 로드
     */
    function loadServerData(keyword) {
        var $tbody = $container.find('#customerTableBody');

        // 로딩 표시
        $tbody.html(createLoadingMessage());

        // AJAX 파라미터 구성
        var ajaxParams = {
            codeGubun: 'icomcmpyPop',
            BUSINESS_COND: businessCond,
            MULTI: allowMultiple ? 'Y' : 'N'
        };

        if (keyword) {
            ajaxParams.COM_NAME_LOC = keyword;
        }

        console.log('[Customer Popup] 서버 요청 시작:', ajaxParams);

        // HttpUtil을 사용한 POST 요청
        HttpUtil.post(apiUrl, ajaxParams, {
            timeout: 30000,
            showLoader: false,
            showDefaultAlert: false
        }).then(function(response) {
            console.log('[Customer Popup] 서버 응답:', response);

            var data = parseAPIResponse(response.data);
            if (data && data.length > 0) {
                // 검색어가 없는 경우(초기 로드)에만 전체 데이터 저장
                if (!keyword) {
                    allData = data;
                }
                customerData = data;
                renderCustomerList(customerData);
            } else {
                $tbody.html('<tr class="message-row" style="height: 25px; cursor: default;"><td colspan="3" style="text-align: center; color: #6c757d; font-style: italic; display: table-cell !important;">조회된 데이터가 없습니다.</td></tr>');
            }
        }).catch(function(error) {
            console.error('[Customer Popup] 서버 요청 실패:', error);
            $tbody.html('<tr class="message-row" style="height: 25px; cursor: default;"><td colspan="3" style="text-align: center; color: #dc3545; display: table-cell !important;">데이터 로드 중 오류가 발생했습니다.</td></tr>');
            alert(error.userMessage || '고객사 정보를 불러오는 중 오류가 발생했습니다.');
        });

        return api;
    }

    /**
     * API 응답 파싱
     */
    function parseAPIResponse(responseData) {
        try {
            var jsonData;

            // 이미 객체인 경우
            if (typeof responseData === 'object') {
                jsonData = responseData;
            } else {
                // 문자열인 경우 JSON 파싱
                jsonData = JSON.parse(responseData);
            }

            // Data 속성 확인 (IBSheetResponseUtil은 대문자 D로 응답)
            if (!jsonData.Data) {
                console.error('[Customer Popup] 응답에 Data 속성이 없습니다:', jsonData);
                return [];
            }

            return jsonData.Data;

        } catch (e) {
            console.error('[Customer Popup] JSON 파싱 에러:', e);
            return [];
        }
    }

    /**
     * 고객사 목록 렌더링 (CheckCellMediumLabel 스타일 사용)
     */
    function renderCustomerList(data) {
        var $tbody = $container.find('#customerTableBody');
        $tbody.empty();

        if (!data || data.length === 0) {
            $tbody.append('<tr class="message-row" style="height: 25px; cursor: default;"><td colspan="3" style="text-align: center; color: #6c757d; font-style: italic; display: table-cell !important;">검색 결과가 없습니다.</td></tr>');
            return;
        }

        data.forEach(function(customer, index) {
            var inputType = allowMultiple ? 'checkbox' : 'radio';
            var inputName = allowMultiple ? 'customerCheck' : 'customerRadio';

            var row = '<tr style="cursor: pointer;" data-index="' + index + '">' +
                      '<td>' +
                      '<label class="CheckCellMediumLabel">' +
                      '<input type="' + inputType + '" name="' + inputName + '" value="' + customer.COM_CODE + '" ' +
                      'data-compy-name="' + (customer.COM_NAME_LOC || '') + '" ' +
                      'data-compy-code="' + (customer.COM_CODE || '') + '" ' +
                      'data-item-count="' + (customer.LOGISTICS_CENTER_CNT || 0) + '" ' +
                      'data-index="' + index + '">' +
                      '<span class="CheckCellMediumCustom"></span>' +
                      '</label>' +
                      '</td>' +
                      '<td>' + (customer.COM_NAME_LOC || '') + '</td>' +
                      '<td>' + formatNumber(customer.LOGISTICS_CENTER_CNT || 0) + '</td>' +
                      '</tr>';

            $tbody.append(row);
        });

        console.log('[Customer Popup] 고객사 목록 렌더링 완료:', data.length, '건');
    }

    /**
     * 검색 기능 (클라이언트 필터링)
     */
    function searchCustomer(keyword) {
        if (!keyword || keyword.trim() === '') {
            renderCustomerList(allData);
            return;
        }

        var searchKeyword = keyword.toLowerCase().trim();
        var filtered = allData.filter(function(customer) {
            var companyName = (customer.COM_NAME_LOC || '').toLowerCase();
            var companyCode = (customer.COM_CODE || '').toLowerCase();
            return companyName.indexOf(searchKeyword) > -1 || companyCode.indexOf(searchKeyword) > -1;
        });

        renderCustomerList(filtered);
        console.log('[Customer Popup] 검색 결과:', filtered.length, '건');
    }

    /**
     * 선택된 고객사 가져오기
     */
    function getSelectedCustomers() {
        var selected = [];
        var inputSelector = allowMultiple ? 'input[name="customerCheck"]:checked' : 'input[name="customerRadio"]:checked';

        $container.find(inputSelector).each(function() {
            var $input = $(this);
            selected.push({
                code: $input.data('compy-code'),
                name: $input.data('compy-name'),
                itemCount: $input.data('item-count')
            });
        });

        return selected;
    }

    /**
     * 확인 버튼 클릭 콜백 설정
     */
    function onConfirm(callback) {
        confirmCallback = callback;
        return api; // 체이닝 지원
    }

    /**
     * 취소(닫기) 콜백 설정
     */
    function onCancel(callback) {
        cancelCallback = callback;
        return api; // 체이닝 지원
    }

    /**
     * 숫자 포맷팅
     */
    function formatNumber(num) {
        if (!num) return '0';
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    /**
     * 로딩 메시지 생성 (gif 이미지 사용)
     */
    function createLoadingMessage() {
        return '<tr class="loading-row"><td colspan="3" style="padding: 120px 20px; text-align: center; display: table-cell !important;">' +
               '<img src="/resources/libs/ibsheet7/js/DeepBlue/90px.gif" alt="로딩중..." />' +
               '</td></tr>';
    }

    /**
     * 이벤트 바인딩 (내부 함수, 자동 실행)
     */
    function bindEvents() {
        // 기존 이벤트 제거 (중복 방지)
        $container.find('#DIVclosePopup').off('click');
        $container.find('#confirmBtn').off('click');
        $container.find('#customerSearchBtn').off('click');
        $container.find('#customerSearchInput').off('keypress input');
        $overlay.off('click');

        // X 버튼 클릭 이벤트
        $container.find('#DIVclosePopup').on('click', function(e) {
            e.preventDefault();
            if (cancelCallback) cancelCallback();
            close();
        });

        // 확인 버튼 클릭 이벤트
        $container.find('#confirmBtn').on('click', function(e) {
            e.preventDefault();
            var selectedCustomers = getSelectedCustomers();

            if (selectedCustomers.length === 0) {
                alert('고객사를 선택해 주세요.');
                return;
            }

            if (confirmCallback) {
                confirmCallback(selectedCustomers);
            }
            close();
        });

        // 검색 버튼 클릭 이벤트
        $container.find('#customerSearchBtn').on('click', function(e) {
            e.preventDefault();
            var keyword = $container.find('#customerSearchInput').val();
            searchCustomer(keyword);
        });

        // 실시간 검색 (입력할 때마다 필터링)
        $container.find('#customerSearchInput').on('input', function() {
            var keyword = $(this).val();
            searchCustomer(keyword);
        });

        // 오버레이 클릭 시 닫기
        $overlay.on('click', function() {
            if (cancelCallback) cancelCallback();
            close();
        });

        // 고객사 행 클릭 시 체크박스 토글 (동적 바인딩 - 이벤트 위임)
        $container.find('#customerTableBody').off('click', 'tr:not(.loading-row):not(.message-row)');
        $container.find('#customerTableBody').on('click', 'tr:not(.loading-row):not(.message-row)', function(e) {
            // 체크박스 직접 클릭한 경우는 기본 동작 유지 (이벤트 버블링으로 처리됨)
            if ($(e.target).is('input[type="checkbox"], input[type="radio"], .CheckCellMediumCustom')) {
                return; // 체크박스 자체 클릭은 기본 동작 유지
            }

            // 행 클릭 시 해당 행의 체크박스/라디오 버튼 토글
            var $checkbox = $(this).find('input[type="checkbox"], input[type="radio"]');
            if ($checkbox.length > 0) {
                $checkbox.prop('checked', !$checkbox.prop('checked'));
                console.log('[Customer Popup] 행 클릭으로 선택 토글:', $checkbox.data('compy-name'));
            }
        });

        console.log('[Customer Popup] 이벤트 자동 바인딩 완료');
    }

    // Public API 속성 할당
    api.setAllowMultiple = setAllowMultiple;
    api.setApiUrl = setApiUrl;
    api.setBusinessCond = setBusinessCond;
    api.setCustomerData = setCustomerData;
    api.loadServerData = loadServerData;
    api.searchCustomer = searchCustomer;
    api.getSelectedCustomers = getSelectedCustomers;
    api.onConfirm = onConfirm;
    api.onCancel = onCancel;
    api.close = close;
    api.$overlay = $overlay;
    api.$container = $container;

    // ========================================
    // 자동 실행: 이벤트 즉시 바인딩
    // ========================================
    bindEvents();

    // 서버 데이터 자동 로드 (초기화 시)
    loadServerData('');

    return api;
};
</script>
