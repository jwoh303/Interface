<script type="text/javascript">
/**
 * 부서 검색 팝업 API
 * PopupUtil에서 window.createPopupAPI를 자동 호출
 */
window.createPopupAPI = function(overlayId, containerId, options) {
    var $overlay = $('#' + overlayId);
    var $container = $('#' + containerId);
    var selectCallback = null;
    var animationType = $container.data('animationType') || 'default';

    // options에서 com_code 수신
    var comCode = (options && options.data && options.data.com_code) || '';

    // 데이터 관련
    var allData = [];
    var currentPage = 1;
    var pageSize = 7;
    var totalCount = 0;
    var totalPages = 0;

    // DOM 참조
    var $deptCodeTable = $container.find('#deptCodeTable');
    var $deptCodeTableBody = $container.find('#deptCodeTableBody');
    var $totalCountArea = $container.find('#totalCountArea');
    var $totalCount = $container.find('#totalCount');
    var $pagingArea = $container.find('#pagingArea');

    var api = {};

    /**
     * 팝업 닫기
     */
    function close() {
        var $popup = $container.find('.DIVpopup');
        if ($popup.hasClass('popup-button-exit') || $popup.hasClass('popup-exit')) {
            return;
        }
        var exitClass = animationType === 'fromButton' ? 'popup-button-exit' : 'popup-exit';
        var animationDuration = animationType === 'fromButton' ? 1000 : 200;

        $popup.removeClass('popup-enter popup-button-enter').addClass(exitClass);
        $overlay.removeClass('popup-enter').addClass('popup-exit');

        setTimeout(function() {
            $overlay.remove();
            $container.remove();

            if ($('[id^="popup-overlay-"]').length === 0) {
                var scrollY = $('body').data('scrollY') || 0;
                $('body').css({
                    'position': '',
                    'top': '',
                    'left': '',
                    'right': '',
                    'overflow-y': ''
                });
                window.scrollTo(0, scrollY);
            }
        }, animationDuration);
    }

    /**
     * 선택 콜백 설정 (체이닝)
     */
    function onSelect(callback) {
        selectCallback = callback;
        return api;
    }

    /**
     * NoData 표시 (테이블 tbody 내부)
     */
    function showNoData(message) {
        $deptCodeTable.show();
        $deptCodeTableBody.html(
            '<tr><td colspan="4"><div class="NoData mt50 mb50">' +
            '<img src="/resources/imgs/Icon_Warning01.png" alt="경고" /><br/>' +
            (message || '조회된 데이터가 없습니다.') +
            '</div></td></tr>'
        );
    }

    /**
     * 부서코드 검색
     */
    function searchDeptCode() {
        var params = {
            codeGubun: 'deptCodeAdminPop_v2',
            com_code: comCode,
            st_req_dept_code: $container.find('#st_req_dept_code').val(),
            st_req_dept_name: $container.find('#st_req_dept_name').val(),
            st_open: 'Y',
            st_type: 'C001',
            st_dept_type: 'D',
            dept_type: 'D',
            st_init_flag: 'Y'
        };

        // 로딩 표시
        $deptCodeTableBody.html(
            '<tr><td colspan="4" style="height:200px; text-align:center; color:#999;">' +
            '<img src="/resources/libs/ibsheet7/js/DeepBlue/90px.gif" alt="로딩중..." />' +
            '</td></tr>'
        );
        $deptCodeTable.show();
        $pagingArea.hide();

        HttpUtil.post('/common/commonList_v3.do', params, {
            showLoader: false,
            showDefaultAlert: false
        }).then(function(response) {
            var result = response.data || {};
            allData = result.data || [];
            totalCount = allData.length;
            currentPage = 1;

            if (totalCount > 0) {
                $totalCountArea.show();
                $totalCount.text(totalCount);
                $deptCodeTable.show();
                renderTable();
            } else {
                $totalCountArea.show();
                $totalCount.text('0');
                showNoData('조회된 데이터가 없습니다.');
                $pagingArea.hide();
            }
        }).catch(function(error) {
            console.error('[DeptCodePopup] 검색 실패:', error);
            showNoData('조회된 데이터가 없습니다.');
            $pagingArea.hide();
            alert(error.userMessage || '부서 정보를 불러오는 중 오류가 발생했습니다.');
        });
    }

    /**
     * 테이블 렌더링 (전체 표시, 영역 스크롤)
     */
    function renderTable() {
        $deptCodeTableBody.empty();

        for (var i = 0; i < allData.length; i++) {
            var row = allData[i];
            var tr = '<tr data-index="' + i + '">' +
                     '<td>' + (row.CODE || '') + '</td>' +
                     '<td>' + (row.TEXT1 || '') + '</td>' +
                     '<td>' + (row.TEXT2 || '') + '</td>' +
                     '<td><button type="button" class="ButOutline_Tiny btn-select" data-index="' + i + '">선택</button></td>' +
                     '</tr>';
            $deptCodeTableBody.append(tr);
        }
    }

    /**
     * 페이징 렌더링
     */
    function renderPaging() {
        if (totalPages <= 1) {
            $pagingArea.hide();
            return;
        }

        $pagingArea.show();
        var html = '';

        // 첫 페이지
        html += '<button type="button" class="ButPagLeft02"' + (currentPage <= 1 ? ' disabled' : '') + '></button>';
        // 이전 페이지
        html += '<button type="button" class="ButPagLeft01"' + (currentPage <= 1 ? ' disabled' : '') + '></button>';

        // 페이지 번호 (최대 5개 표시)
        var startPage = Math.max(1, currentPage - 2);
        var endPage = Math.min(totalPages, startPage + 4);
        if (endPage - startPage < 4) {
            startPage = Math.max(1, endPage - 4);
        }

        for (var p = startPage; p <= endPage; p++) {
            if (p === currentPage) {
                html += '<p data-page="' + p + '" style="color:#fff; background-color:#272E47;">' + p + '</p>';
            } else {
                html += '<p data-page="' + p + '">' + p + '</p>';
            }
        }

        // 다음 페이지
        html += '<button type="button" class="ButPagRight01"' + (currentPage >= totalPages ? ' disabled' : '') + '></button>';
        // 마지막 페이지
        html += '<button type="button" class="ButPagRight02"' + (currentPage >= totalPages ? ' disabled' : '') + '></button>';

        $pagingArea.html(html);
    }

    /**
     * 행 선택 처리
     */
    function selectRow(index) {
        var row = allData[index];
        if (!row) return;

        if (selectCallback) {
            selectCallback(row);
        }
        close();
    }

    /**
     * 이벤트 바인딩
     */
    function bindEvents() {
        // 조회 버튼
        $container.find('#btnSearch').on('click', function() {
            searchDeptCode();
        });

        // 엔터키
        $container.find('#st_req_dept_code, #st_req_dept_name').on('keydown', function(e) {
            if (e.keyCode === 13) {
                e.preventDefault();
                searchDeptCode();
            }
        });

        // 닫기 버튼
        $container.find('#DIVclosePopup').on('click', function(e) {
            e.preventDefault();
            close();
        });

        // 오버레이 클릭
        $overlay.on('click', function() {
            close();
        });

        // 선택 버튼 (이벤트 위임)
        $deptCodeTableBody.on('click', '.btn-select', function(e) {
            e.stopPropagation();
            var idx = parseInt($(this).data('index'));
            selectRow(idx);
        });

        // 행 클릭으로 선택
        $deptCodeTableBody.on('click', 'tr', function() {
            var idx = parseInt($(this).data('index'));
            if (!isNaN(idx)) {
                selectRow(idx);
            }
        });

        // 페이징 이벤트 (이벤트 위임)
        $pagingArea.on('click', 'p', function() {
            currentPage = parseInt($(this).data('page'));
            renderTable();
            renderPaging();
        });
        $pagingArea.on('click', '.ButPagLeft02:not(:disabled)', function() {
            currentPage = 1;
            renderTable();
            renderPaging();
        });
        $pagingArea.on('click', '.ButPagLeft01:not(:disabled)', function() {
            currentPage = Math.max(1, currentPage - 1);
            renderTable();
            renderPaging();
        });
        $pagingArea.on('click', '.ButPagRight01:not(:disabled)', function() {
            currentPage = Math.min(totalPages, currentPage + 1);
            renderTable();
            renderPaging();
        });
        $pagingArea.on('click', '.ButPagRight02:not(:disabled)', function() {
            currentPage = totalPages;
            renderTable();
            renderPaging();
        });
    }

    // API 공개 메서드
    api.close = close;
    api.onSelect = onSelect;
    api.searchDeptCode = searchDeptCode;
    api.$overlay = $overlay;
    api.$container = $container;

    // 자동 초기화
    bindEvents();

    // 초기 조회 자동 실행
    searchDeptCode();

    return api;
};
</script>
