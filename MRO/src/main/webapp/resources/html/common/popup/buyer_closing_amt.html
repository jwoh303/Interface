
<div class="DIVpopup-overlay" id="DIVpopupOverlay"></div>
<div class="DIVpopup" id="DIVpopup" style="width: 800px; height: 500px; overflow: hidden;">
  <div class="wrapPopup" style="height: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 20px;">
    <div class="PopupTit" style="flex-shrink: 0;">고객사별 마감금액<span><a href="#" id="DIVclosePopup"><img src="/resources/imgs/Icon_close.png" /></a></span></div>
    <div class="h10" style="flex-shrink: 0;"></div>

    <!-- 테이블 영역 (IBSheetTablePopup 스타일 사용) -->
    <div class="IBSheetPopup" style="flex: 1; min-height: 0; margin-top: 10px; overflow-y: auto; overflow-x: hidden; border: 1px solid #ddd; border-radius: 4px;">
      <div style="min-height: min-content;">
        <table class="IBSheetTablePopup" id="buyerClosingTable" style="width:100%;">
          <colgroup>
            <col width="5%" />
            <col width="35%" />
            <col width="20%" />
            <col width="10%" />
            <col width="10%" />
            <col width="20%" />
          </colgroup>
          <thead>
            <tr>
              <th>NO</th>
              <th>고객사명</th>
              <th>마감금액</th>
              <th>출력</th>
              <th>담당자</th>
              <th>담당자연락처</th>
            </tr>
          </thead>
          <tbody id="buyerClosingTableBody">
            <!-- 동적으로 데이터 로드 -->
          </tbody>
        </table>
      </div>
    </div>

    <div style="flex-shrink: 0; height: 20px;"></div>
    <div class="PopupListBtnBox_Center" style="flex-shrink: 0;">
      <button class="ButPrimary_large" id="confirmBtn">확인</button>
    </div>
  </div><!-- wrapPopup 끝-->
</div>

<style>
/* 팝업 전체 레이아웃 - 고정 높이로 흔들림 방지 */
#DIVpopup {
  display: flex;
  flex-direction: column;
  height: 500px !important;
}

.wrapPopup {
  height: 100% !important;
  max-height: 100% !important;
  overflow: hidden !important;
}

/* base.css 스타일 오버라이드 - 팝업 내 테이블 전용 */
.IBSheetTablePopup {
  width: 100%;
  height: auto;
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
}

.IBSheetTablePopup thead {
  position: sticky;
  top: 0;
  z-index: 100;
}

.IBSheetTablePopup thead tr {
  box-sizing: border-box;
}

/* base.css 스타일 적용 - 헤더 */
.IBSheetTablePopup th {
  height: 50px;
  line-height: 50px;
  text-align: center;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -0.8px;
  color: #5B5C61;
  vertical-align: middle;
  border-bottom: 1px solid #dedede;
  border-left: 1px solid #dedede;
  background-color: #f2f7ff;
}

.IBSheetTablePopup th:first-child {
  border-left: 0px;
}

/* base.css 스타일 적용 - 바디 */
.IBSheetTablePopup tbody {
  display: table-row-group;
  height: auto;
}

.IBSheetTablePopup tbody tr {
  cursor: pointer;
  transition: background-color 0.2s;
}

.IBSheetTablePopup tbody tr:hover:not(.loading-row):not(.message-row) {
  background-color: #f1f3f5;
}

.IBSheetTablePopup td {
  height: 32px;
  line-height: 20px;
  text-align: center;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: -0.5px;
  vertical-align: middle;
  color: #404046;
  border-bottom: 2px solid #eeeeee;
  border-left: 1px solid #eeeeee;
  background-color: #fff;
}

.IBSheetTablePopup td:first-child {
  border-left: 0px;
}

/* 고객사명 좌측 정렬 */
.IBSheetTablePopup tbody td:nth-child(2) {
  text-align: left;
  padding-left: 12px;
}

/* 마감금액 우측 정렬 */
.IBSheetTablePopup tbody td:nth-child(3) {
  text-align: right;
  padding-right: 12px;
}

/* 출력 버튼 셀 가운데 정렬 */
.IBSheetTablePopup tbody td:nth-child(4) {
  text-align: center;
  vertical-align: middle;
  padding: 0;
}

/* 로딩/메시지 row 스타일 */
.IBSheetTablePopup tbody tr.loading-row td,
.IBSheetTablePopup tbody tr.message-row td {
  display: table-cell !important;
  text-align: center;
  vertical-align: middle;
}

.IBSheetTablePopup tbody tr.loading-row td {
  border-bottom: none !important;
}

/* 출력 버튼 스타일 */
.print-btn {
  padding: 4px 12px;
  font-size: 12px;
  cursor: pointer;
  border: 1px solid #2172EC;
  background-color: #fff;
  color: #2172EC;
  border-radius: 4px;
  transition: all 0.2s;
  vertical-align: middle;
  display: inline-block;
}

.print-btn:hover {
  background-color: #2172EC;
  color: #fff;
}
</style>

<script type="text/javascript">
/**
 * 팝업 API 생성 함수 (전역 - 모든 팝업 공통 함수명)
 * PopupUtil에서 window.createPopupAPI를 자동으로 호출하여 팝업 API 객체를 받습니다.
 *
 * @param {string} overlayId - 오버레이 ID (PopupUtil에서 자동 생성하여 전달)
 * @param {string} containerId - 컨테이너 ID (PopupUtil에서 자동 생성하여 전달)
 * @param {Object} options - 옵션 객체 (data, onClose 등)
 * @returns {Object} 팝업 API 객체
 */
window.createPopupAPI = function(overlayId, containerId, options) {
    var $overlay = $('#' + overlayId);
    var $container = $('#' + containerId);
    var animationType = $container.data('animationType') || 'default';

    // options에서 taxBillNo 가져오기
    var taxBillNo = (options && options.data && options.data.taxBillNo) ? options.data.taxBillNo : '';

    // Public API 객체
    var api = {};

    /**
     * 팝업 닫기 (애니메이션 포함)
     */
    function close() {
        var $popup = $container.find('.DIVpopup');

        // 이미 닫기 애니메이션 중이면 무시
        if ($popup.hasClass('popup-button-exit') || $popup.hasClass('popup-exit')) {
            return;
        }

        // 애니메이션 타입에 따른 클래스 결정
        var exitClass = animationType === 'fromButton' ? 'popup-button-exit' : 'popup-exit';
        var animationDuration = animationType === 'fromButton' ? 1000 : 200;

        // 열기 애니메이션 클래스 제거 후 닫기 애니메이션 적용
        $popup.removeClass('popup-enter popup-button-enter').addClass(exitClass);
        $overlay.removeClass('popup-enter').addClass('popup-exit');

        // 애니메이션 완료 후 제거
        setTimeout(function() {
            $overlay.remove();
            $container.remove();

            // body 스크롤 복원 (모든 팝업이 닫혔는지 확인)
            if ($('[id^="popup-overlay-"]').length === 0) {
                var scrollY = $('body').data('scrollY') || 0;
                $('body').css({
                    'position': '',
                    'top': '',
                    'left': '',
                    'right': '',
                    'overflow-y': ''
                });
                window.scrollTo(0, scrollY);
            }

            console.log('[BuyerClosingAmtPopup] 팝업 닫힘');
        }, animationDuration);
    }

    /**
     * 서버에서 데이터 로드
     * @param {string} billNo - 세금계산서 번호
     */
    api.loadData = function(billNo) {
        if (billNo) {
            taxBillNo = billNo;
        }

        if (!taxBillNo) {
            console.error('[BuyerClosingAmtPopup] taxBillNo가 없습니다.');
            return api;
        }

        var $tbody = $container.find('#buyerClosingTableBody');

        // 로딩 표시
        $tbody.html(createLoadingMessage());

        console.log('[BuyerClosingAmtPopup] 데이터 로드 시작:', taxBillNo);

        // HttpUtil을 사용한 POST 요청
        HttpUtil.post('/mpiv/getCommonMpIvBuyerClosingAmtList.do', {
            st_tax_bill_no: taxBillNo
        }, {
            timeout: 30000,
            showLoader: false,
            showDefaultAlert: false
        }).then(function(response) {
            console.log('[BuyerClosingAmtPopup] 서버 응답:', response);

            var data = parseAPIResponse(response.data);
            if (data && data.length > 0) {
                renderTable(data);
            } else {
                $tbody.html('<tr class="message-row"><td colspan="6" style="text-align: center; color: #6c757d; font-style: italic; padding: 40px 0;">조회된 데이터가 없습니다.</td></tr>');
            }
        }).catch(function(error) {
            console.error('[BuyerClosingAmtPopup] 서버 요청 실패:', error);
            $tbody.html('<tr class="message-row"><td colspan="6" style="text-align: center; color: #dc3545; padding: 40px 0;">데이터 로드 중 오류가 발생했습니다.</td></tr>');
        });

        return api;
    };

    /**
     * API 응답 파싱
     */
    function parseAPIResponse(responseData) {
        try {
            var jsonData;

            // 이미 객체인 경우
            if (typeof responseData === 'object') {
                jsonData = responseData;
            } else {
                // 문자열인 경우 JSON 파싱
                jsonData = JSON.parse(responseData);
            }

            // Data 속성 확인
            if (!jsonData.Data) {
                console.error('[BuyerClosingAmtPopup] 응답에 Data 속성이 없습니다:', jsonData);
                return [];
            }

            return jsonData.Data;

        } catch (e) {
            console.error('[BuyerClosingAmtPopup] JSON 파싱 에러:', e);
            return [];
        }
    }

    /**
     * 테이블 렌더링
     */
    function renderTable(data) {
        var $tbody = $container.find('#buyerClosingTableBody');
        $tbody.empty();

        if (!data || data.length === 0) {
            $tbody.html('<tr class="message-row"><td colspan="6" style="text-align: center; color: #6c757d; font-style: italic; padding: 40px 0;">조회된 데이터가 없습니다.</td></tr>');
            return;
        }

        data.forEach(function(item, index) {
            var row = '<tr>' +
                '<td>' + (index + 1) + '</td>' +
                '<td>' + (item.BUYER_NAME || '') + '</td>' +
                '<td>' + formatNumber(item.AMT) + '</td>' +
                '<td><button class="print-btn" data-buyer-code="' + (item.BUYER_CODE || '') + '">출력</button></td>' +
                '<td>' + (item.KEP_USER_NAME || '') + '</td>' +
                '<td>' + (item.PHONE_NUMBER || '') + '</td>' +
                '</tr>';

            $tbody.append(row);
        });

        console.log('[BuyerClosingAmtPopup] 테이블 렌더링 완료:', data.length, '건');
    }

    /**
     * 숫자 포맷팅
     */
    function formatNumber(num) {
        if (!num) return '0';
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    /**
     * 로딩 메시지 생성
     */
    function createLoadingMessage() {
        return '<tr class="loading-row"><td colspan="6" style="padding: 80px 20px; text-align: center;">' +
               '<img src="/resources/libs/ibsheet7/js/DeepBlue/90px.gif" alt="로딩중..." />' +
               '</td></tr>';
    }

    /**
     * 이벤트 바인딩
     */
    function bindEvents() {
        // 기존 이벤트 제거 (중복 방지)
        $container.find('#DIVclosePopup').off('click');
        $container.find('#confirmBtn').off('click');
        $overlay.off('click');
        $container.find('#buyerClosingTableBody').off('click', '.print-btn');

        // X 버튼 클릭 이벤트
        $container.find('#DIVclosePopup').on('click', function(e) {
            e.preventDefault();
            close();
        });

        // 확인 버튼 클릭 이벤트
        $container.find('#confirmBtn').on('click', function(e) {
            e.preventDefault();
            close();
        });

        // 오버레이 클릭 시 닫기
        $overlay.on('click', function() {
            close();
        });

        // 출력 버튼 클릭 이벤트 (이벤트 위임)
        $container.find('#buyerClosingTableBody').on('click', '.print-btn', function(e) {
            e.preventDefault();
            e.stopPropagation();

            var buyerCode = $(this).data('buyer-code');

            console.log('[BuyerClosingAmtPopup] 출력 버튼 클릭 - taxBillNo:', taxBillNo, ', buyerCode:', buyerCode);

            if (typeof window.reportOpen === 'function') {
                window.reportOpen("RD_06_S_001_92", "[" + taxBillNo + "][" + buyerCode + "]");
            } else {
                alert('리포트 기능을 사용할 수 없습니다.');
            }
        });

        console.log('[BuyerClosingAmtPopup] 이벤트 바인딩 완료');
    }

    // Public API 속성 할당
    api.loadData = api.loadData;
    api.close = close;
    api.$overlay = $overlay;
    api.$container = $container;

    // ========================================
    // 자동 실행: 이벤트 즉시 바인딩
    // ========================================
    bindEvents();

    // taxBillNo가 있으면 자동 로드
    if (taxBillNo) {
        api.loadData(taxBillNo);
    }

    return api;
};
</script>
