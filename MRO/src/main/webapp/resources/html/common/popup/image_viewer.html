<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>이미지 보기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .image-viewer-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            max-width: 90vw;
            max-height: 90vh;
            overflow: auto;
            padding: 20px;
            position: relative;
        }

        .image-viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .image-viewer-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .image-viewer-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #999;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .image-viewer-close:hover {
            background-color: #f5f5f5;
            color: #333;
        }

        .image-viewer-content {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }

        .image-viewer-content img {
            width: 400px;
            height: 400px;
            object-fit: contain;
            border-radius: 8px;
        }

        .image-viewer-no-image {
            text-align: center;
            color: #999;
            font-size: 16px;
            padding: 60px 20px;
        }

        .image-viewer-no-image svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .image-viewer-loading {
            text-align: center;
            color: #999;
            font-size: 16px;
            padding: 60px 20px;
        }
    </style>
</head>
<body>
    <div class="image-viewer-container">
        <div class="image-viewer-header">
            <div class="image-viewer-title" id="imageTitle">이미지 보기</div>
            <button class="image-viewer-close">&times;</button>
        </div>
        <div class="image-viewer-content" id="imageContent">
            <div class="image-viewer-loading">이미지를 불러오는 중...</div>
        </div>
    </div>

    <script src="/resources/libs/jquery/js/jquery.min.js"></script>
    <script>

        window.createPopupAPI = function(overlayId, containerId) {
            console.log('[image_viewer] createPopupAPI 호출됨:', overlayId, containerId);
            var $overlay = $('#' + overlayId);
            var $container = $('#' + containerId);
            var animationType = $container.data('animationType') || 'default';

            /**
             * 팝업 닫기 (애니메이션 포함)
             */
            function closePopup() {
                var $popup = $container.find('.image-viewer-container');

                // 이미 닫기 애니메이션 중이면 무시
                if ($popup.hasClass('popup-button-exit') || $popup.hasClass('popup-exit')) {
                    return;
                }

                // 애니메이션 타입에 따른 클래스 결정
                var exitClass = animationType === 'fromButton' ? 'popup-button-exit' : 'popup-exit';
                var animationDuration = animationType === 'fromButton' ? 1000 : 200;

                // 열기 애니메이션 클래스 제거 후 닫기 애니메이션 적용
                $popup.removeClass('popup-enter popup-button-enter').addClass(exitClass);
                $overlay.removeClass('popup-enter').addClass('popup-exit');

                // 애니메이션 완료 후 제거
                setTimeout(function() {
                    // 키보드 이벤트 해제
                    $(document).off('keydown.imageViewer');

                    $overlay.remove();
                    $container.remove();

                    // ✅ body 스크롤 복원 (모든 팝업이 닫혔는지 확인)
                    if ($('[id^="popup-overlay-"]').length === 0) {
                        var scrollY = $('body').data('scrollY') || 0;
                        $('body').css({
                            'position': '',
                            'top': '',
                            'left': '',
                            'right': '',
                            'overflow-y': ''
                        });
                        window.scrollTo(0, scrollY);
                        console.log('[Image Viewer] body 스크롤 복원');
                    }

                    console.log('[Image Viewer] 팝업 닫힘');
                }, animationDuration);
            }

            // 닫기 버튼 클릭 이벤트 핸들러
            $('.image-viewer-close').off('click').on('click', function(e) {
                e.preventDefault();
                closePopup();
            });

            // ESC, Enter, Space 키로 팝업 닫기
            $(document).off('keydown.imageViewer').on('keydown.imageViewer', function(e) {
                if (e.key === 'Escape' || e.keyCode === 13 || e.keyCode === 32) {
                    e.preventDefault();
                    closePopup();
                }
            });

            // 오버레이 클릭 시 닫기 (팝업 외부 영역 클릭)
            $overlay.off('click').on('click', function() {
                closePopup();
            });

            var api = {
                /**
                 * 이미지 URL 설정 및 표시
                 * @param {string} imageUrl - 이미지 URL
                 * @param {string} title - 팝업 제목 (선택)
                 */
                showImage: function(imageUrl, title) {
                    console.log('[이미지 뷰어] 이미지 표시:', imageUrl);

                    var contentDiv = document.getElementById('imageContent');
                    var titleDiv = document.getElementById('imageTitle');

                    // 제목 설정
                    if (title) {
                        titleDiv.textContent = title;
                    }

                    // 이미지가 없는 경우
                    if (!imageUrl || imageUrl === '' || imageUrl === 'null') {
                        contentDiv.innerHTML =
                            '<div class="image-viewer-no-image">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                            '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>' +
                            '<circle cx="8.5" cy="8.5" r="1.5"></circle>' +
                            '<polyline points="21 15 16 10 5 21"></polyline>' +
                            '</svg>' +
                            '<div>등록된 이미지가 없습니다.</div>' +
                            '</div>';
                        return api;
                    }

                    // 이미지 표시
                    var img = new Image();
                    img.onload = function() {
                        contentDiv.innerHTML = '';
                        contentDiv.appendChild(img);
                    };
                    img.onerror = function() {
                        contentDiv.innerHTML =
                            '<div class="image-viewer-no-image">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                            '<rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>' +
                            '<circle cx="8.5" cy="8.5" r="1.5"></circle>' +
                            '<polyline points="21 15 16 10 5 21"></polyline>' +
                            '</svg>' +
                            '<div>이미지를 불러올 수 없습니다.</div>' +
                            '</div>';
                    };
                    img.src = imageUrl;

                    return api;
                },

                /**
                 * 팝업 닫기
                 */
                close: closePopup
            };

            return api;
        };
    </script>
</body>
</html>
