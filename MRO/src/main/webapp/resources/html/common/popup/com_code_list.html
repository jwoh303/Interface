<script type="text/javascript">
/**
 * 회사조회 팝업 API
 * PopupUtil에서 window.createPopupAPI를 자동 호출
 */
window.createPopupAPI = function(overlayId, containerId) {
    var $overlay = $('#' + overlayId);
    var $container = $('#' + containerId);
    var selectCallback = null;
    var animationType = $container.data('animationType') || 'default';

    // 데이터 관련
    var allData = [];
    var currentPage = 1;
    var pageSize = 7;
    var totalCount = 0;
    var totalPages = 0;

    // DOM 참조
    var $comCodeTable = $container.find('#comCodeTable');
    var $comCodeTableBody = $container.find('#comCodeTableBody');
    var $totalCountArea = $container.find('#totalCountArea');
    var $totalCount = $container.find('#totalCount');
    var $pagingArea = $container.find('#pagingArea');

    var api = {};

    /**
     * 팝업 닫기
     */
    function close() {
        var $popup = $container.find('.DIVpopup');
        if ($popup.hasClass('popup-button-exit') || $popup.hasClass('popup-exit')) {
            return;
        }
        var exitClass = animationType === 'fromButton' ? 'popup-button-exit' : 'popup-exit';
        var animationDuration = animationType === 'fromButton' ? 1000 : 200;

        $popup.removeClass('popup-enter popup-button-enter').addClass(exitClass);
        $overlay.removeClass('popup-enter').addClass('popup-exit');

        setTimeout(function() {
            $overlay.remove();
            $container.remove();

            if ($('[id^="popup-overlay-"]').length === 0) {
                var scrollY = $('body').data('scrollY') || 0;
                $('body').css({
                    'position': '',
                    'top': '',
                    'left': '',
                    'right': '',
                    'overflow-y': ''
                });
                window.scrollTo(0, scrollY);
            }
        }, animationDuration);
    }

    /**
     * 선택 콜백 설정 (체이닝)
     */
    function onSelect(callback) {
        selectCallback = callback;
        return api;
    }

    /**
     * 숫자만 입력 허용
     */
    function numOnly(e) {
        var val = $(e.target).val().replace(/[^0-9]/g, '');
        $(e.target).val(val);
    }

    /**
     * 유효성 검사
     */
    function validateIrsNo() {
        var no1 = $container.find('#h_irs_no1').val();
        var no2 = $container.find('#h_irs_no2').val();
        var no3 = $container.find('#h_irs_no3').val();

        if (!no1 || !no2 || !no3) {
            alert('사업자번호를 입력해주시기 바랍니다.');
            return false;
        }
        if (no1.length !== 3 || no2.length !== 2 || no3.length !== 5) {
            alert('사업자번호를 정확하게 입력해주시기 바랍니다.');
            return false;
        }
        return true;
    }

    /**
     * NoData 표시 (테이블 tbody 내부)
     */
    function showNoData(message) {
        $comCodeTable.show();
        $comCodeTableBody.html(
            '<tr><td colspan="4"><div class="NoData mt50 mb50">' +
            '<img src="/resources/imgs/Icon_Warning01.png" alt="경고" /><br/>' +
            (message || '조회된 데이터가 없습니다.') +
            '</div></td></tr>'
        );
    }

    /**
     * 회사코드 검색
     */
    function searchComCode() {
        if (!validateIrsNo()) return;

        var params = {
            h_irs_no1: $container.find('#h_irs_no1').val(),
            h_irs_no2: $container.find('#h_irs_no2').val(),
            h_irs_no3: $container.find('#h_irs_no3').val(),
            h_business_cond: $container.data('businessCond') || ''
        };

        // 로딩 표시
        $comCodeTableBody.html(
            '<tr><td colspan="4" style="height:200px; text-align:center; color:#999;">' +
            '<img src="/resources/libs/ibsheet7/js/DeepBlue/90px.gif" alt="로딩중..." />' +
            '</td></tr>'
        );
        $comCodeTable.show();
      //  $totalCountArea.hide();
        $pagingArea.hide();

        HttpUtil.post('/common/getComCodeListJson.do', params, {
            showLoader: false,
            showDefaultAlert: false
        }).then(function(response) {
            var result = response.data || {};
            allData = result.data || [];
            totalCount = result.totalCount || 0;
            currentPage = 1;

            if (totalCount > 0) {
                $totalCountArea.show();
                $totalCount.text(totalCount);
                $comCodeTable.show();
                renderTable();
            } else {
                $totalCountArea.show();
                $totalCount.text('0');
                showNoData('조회된 데이터가 없습니다.');
                $pagingArea.hide();
            }
        }).catch(function(error) {
            console.error('[ComCodePopup] 검색 실패:', error);
            showNoData('조회된 데이터가 없습니다.');
            $pagingArea.hide();
            alert(error.userMessage || '회사 정보를 불러오는 중 오류가 발생했습니다.');
        });
    }

    /**
     * 테이블 렌더링 (전체 표시, 영역 스크롤)
     */
    function renderTable() {
        $comCodeTableBody.empty();

        for (var i = 0; i < allData.length; i++) {
            var row = allData[i];
            var tr = '<tr data-index="' + i + '">' +
                     '<td>' + (row.COM_CODE || '') + '</td>' +
                     '<td>' + (row.COM_NAME_LOC || '') + '</td>' +
                     '<td>' + (row.IRS_NO || '') + '</td>' +
                     '<td><button type="button" class="ButOutline_Tiny btn-select" data-index="' + i + '">선택</button></td>' +
                     '</tr>';
            $comCodeTableBody.append(tr);
        }
    }

    /**
     * 페이징 렌더링
     */
    function renderPaging() {
        if (totalPages <= 1) {
            $pagingArea.hide();
            return;
        }

        $pagingArea.show();
        var html = '';

        // 첫 페이지
        html += '<button type="button" class="ButPagLeft02"' + (currentPage <= 1 ? ' disabled' : '') + '></button>';
        // 이전 페이지
        html += '<button type="button" class="ButPagLeft01"' + (currentPage <= 1 ? ' disabled' : '') + '></button>';

        // 페이지 번호 (최대 5개 표시)
        var startPage = Math.max(1, currentPage - 2);
        var endPage = Math.min(totalPages, startPage + 4);
        if (endPage - startPage < 4) {
            startPage = Math.max(1, endPage - 4);
        }

        for (var p = startPage; p <= endPage; p++) {
            if (p === currentPage) {
                html += '<p data-page="' + p + '" style="color:#fff; background-color:#272E47;">' + p + '</p>';
            } else {
                html += '<p data-page="' + p + '">' + p + '</p>';
            }
        }

        // 다음 페이지
        html += '<button type="button" class="ButPagRight01"' + (currentPage >= totalPages ? ' disabled' : '') + '></button>';
        // 마지막 페이지
        html += '<button type="button" class="ButPagRight02"' + (currentPage >= totalPages ? ' disabled' : '') + '></button>';

        $pagingArea.html(html);
    }

    /**
     * 행 선택 처리
     */
    function selectRow(index) {
        var row = allData[index];
        if (!row) return;

        // P01_1012_01_YN 체크 (가입불가 회원사)
        if (row.P01_1012_01_YN === 'Y') {
            alert('사용자 가입이 불가능한 회원사입니다.');
            return;
        }

        if (selectCallback) {
            selectCallback(row);
        }
        close();
    }

    /**
     * 이벤트 바인딩
     */
    function bindEvents() {
        // 숫자만 입력
        $container.find('#h_irs_no1, #h_irs_no2, #h_irs_no3').on('input', numOnly);

        // 자동 포커스 이동
        $container.find('#h_irs_no1').on('input', function() {
            if ($(this).val().length >= 3) $container.find('#h_irs_no2').focus();
        });
        $container.find('#h_irs_no2').on('input', function() {
            if ($(this).val().length >= 2) $container.find('#h_irs_no3').focus();
        });

        // 조회 버튼
        $container.find('#btnSearch').on('click', function() {
            searchComCode();
        });

        // 엔터키
        $container.find('#h_irs_no1, #h_irs_no2, #h_irs_no3').on('keydown', function(e) {
            if (e.keyCode === 13) {
                e.preventDefault();
                searchComCode();
            }
        });

        // 닫기 버튼
        $container.find('#DIVclosePopup').on('click', function(e) {
            e.preventDefault();
            close();
        });

        // 오버레이 클릭
        $overlay.on('click', function() {
            close();
        });

        // 선택 버튼 (이벤트 위임)
        $comCodeTableBody.on('click', '.btn-select', function(e) {
            e.stopPropagation();
            var idx = parseInt($(this).data('index'));
            selectRow(idx);
        });

        // 행 클릭으로 선택
        $comCodeTableBody.on('click', 'tr', function() {
            var idx = parseInt($(this).data('index'));
            if (!isNaN(idx)) {
                selectRow(idx);
            }
        });

        // 페이징 이벤트 (이벤트 위임)
        $pagingArea.on('click', 'p', function() {
            currentPage = parseInt($(this).data('page'));
            renderTable();
            renderPaging();
        });
        $pagingArea.on('click', '.ButPagLeft02:not(:disabled)', function() {
            currentPage = 1;
            renderTable();
            renderPaging();
        });
        $pagingArea.on('click', '.ButPagLeft01:not(:disabled)', function() {
            currentPage = Math.max(1, currentPage - 1);
            renderTable();
            renderPaging();
        });
        $pagingArea.on('click', '.ButPagRight01:not(:disabled)', function() {
            currentPage = Math.min(totalPages, currentPage + 1);
            renderTable();
            renderPaging();
        });
        $pagingArea.on('click', '.ButPagRight02:not(:disabled)', function() {
            currentPage = totalPages;
            renderTable();
            renderPaging();
        });
    }

    // API 공개 메서드
    api.close = close;
    api.onSelect = onSelect;
    api.searchComCode = searchComCode;
    api.$overlay = $overlay;
    api.$container = $container;

    // 자동 초기화
    bindEvents();

    // 초기 상태: NoData를 테이블 tbody 안에 표시
    showNoData('사업자번호를 입력 후 조회해 주세요.');
    //$totalCountArea.hide();

    // 첫 번째 입력란에 포커스
    setTimeout(function() {
        $container.find('#h_irs_no1').focus();
    }, 300);

    return api;
};
</script>
