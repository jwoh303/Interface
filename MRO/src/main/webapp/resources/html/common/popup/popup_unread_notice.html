
<div class="DIVpopup-overlay" id="DIVpopupOverlay"></div>
<div class="DIVpopup" id="DIVpopup">
    <div class="wrapPopupText" style="width:440px; padding:40px 30px 30px; text-align:center;">
        <!-- 제목 -->
        <div style="font-size:20px; font-weight:800; color:#222; margin-bottom:16px; line-height:1.4;">
            <span style="font-size:36px; line-height:1; vertical-align:middle; margin-right:6px;">&#128226;</span>확인하지 않은 공지사항이 있습니다.
        </div>
        <!-- 본문 -->
        <div class="unread-notice-body" style="font-size:16px; color:#555; line-height:1.6; margin-bottom:8px;">
            현재 확인하지 않은 공지사항이 총
            <span class="unread-count" style="color:#F6495F; font-weight:700; font-size:17px;">0건</span>
            있습니다.
        </div>
        <!-- 부가 안내 -->
        <div style="font-size:16px; color:#555; margin-bottom:32px; line-height:1.5;">
            공지사항 확인 후 서비스 이용이 가능합니다.
        </div>
        <!-- 버튼 -->
        <div class="PopupListBtnBox_Center">
            <button class="ButPrimary_large btn-go-notice" style="width:100%; max-width:320px;">공지사항 바로가기</button>
        </div>
    </div>
</div>

<script type="text/javascript">

window.createPopupAPI = function(overlayId, containerId, options) {
    var $overlay = $('#' + overlayId);
    var $container = $('#' + containerId);
    var goToNoticeCallback = null;

    /**
     * 강제 팝업 닫기 (프로그래밍 방식 전용)
     */
    function close() {
        var $popup = $container.find('.DIVpopup');
        if ($popup.hasClass('popup-exit')) return;

        $popup.removeClass('popup-enter popup-button-enter').addClass('popup-exit');
        $overlay.removeClass('popup-enter').addClass('popup-exit');

        setTimeout(function() {
            $(document).off('keydown.unreadNotice');
            $overlay.remove();
            $container.remove();

            if ($('[id^="popup-overlay-"]').length === 0) {
                var scrollY = $('body').data('scrollY') || 0;
                $('body').css({
                    'position': '',
                    'top': '',
                    'left': '',
                    'right': '',
                    'overflow-y': ''
                });
                window.scrollTo(0, scrollY);
            }
        }, 200);
    }

    /**
     * 미확인 건수 설정
     */
    function setCount(n) {
        $container.find('.unread-count').text(n + '건');
        $container.show();
        return api;
    }

    /**
     * 바로가기 버튼 콜백 설정
     */
    function onGoToNotice(callback) {
        goToNoticeCallback = callback;
        return api;
    }

    /**
     * 이벤트 바인딩 (강제 팝업 - ESC/오버레이 닫기 불가)
     */
    function bindEvents() {
        // 바로가기 버튼 클릭
        $container.find('.btn-go-notice').off('click').on('click', function(e) {
            e.preventDefault();
            if (goToNoticeCallback) {
                goToNoticeCallback();
            }
            close();
        });

        // ESC 키 차단
        $(document).on('keydown.unreadNotice', function(e) {
            if (e.keyCode === 27) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        });

        // 오버레이 클릭 차단 (닫기 안 함)
        $overlay.off('click').on('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
        });
    }

    var api = {
        setCount: setCount,
        onGoToNotice: onGoToNotice,
        close: close,
        $overlay: $overlay,
        $container: $container
    };

    bindEvents();
    return api;
};
</script>
